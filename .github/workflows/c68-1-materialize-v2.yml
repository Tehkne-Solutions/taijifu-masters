name: C68.1 Disposable V2 Armor Materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-production-head:
    if: github.head_ref == 'agent/c68-1-armor-pack01-v2-final' && github.base_ref == 'validation/c68-1-materialization-base'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c68-1-armor-pack01-v2-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed v2 pixels as valid PNG binaries
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pillow==11.1.0
          python tools/materialize_base04_taijifu_guard_v2.py 2>&1 | tee c68-1-materialize.log
          grep -q 'C68_1_MATERIALIZER=PASS modules=2 candidate=v2 pixel_contract=true' c68-1-materialize.log

      - name: Verify PNG CRC/readability and update exact hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct, zlib
          from pathlib import Path
          from PIL import Image

          root=Path('.')
          paths={
            'armor_01_taijifu_guard_head_accessory': root/'assets/modular_fighters/base_04/armor_01_taijifu_guard/head_accessory.png',
            'armor_01_taijifu_guard_shoulders': root/'assets/modular_fighters/base_04/armor_01_taijifu_guard/shoulders.png',
          }
          expected_bbox={
            'armor_01_taijifu_guard_head_accessory':[496,132,620,192],
            'armor_01_taijifu_guard_shoulders':[340,328,716,420],
          }
          expected_pixels={
            'armor_01_taijifu_guard_head_accessory':4768,
            'armor_01_taijifu_guard_shoulders':13712,
          }
          hashes={}
          for mid,path in paths.items():
            data=path.read_bytes()
            assert data[:8]==b'\x89PNG\r\n\x1a\n'
            pos=8
            while pos < len(data):
              length=struct.unpack('>I', data[pos:pos+4])[0]
              ctype=data[pos+4:pos+8]
              payload=data[pos+8:pos+8+length]
              stored=struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
              calc=zlib.crc32(payload, zlib.crc32(ctype)) & 0xffffffff
              assert stored==calc, (mid,ctype,stored,calc)
              pos += 12+length
              if ctype==b'IEND': break
            assert pos==len(data)
            image=Image.open(path).convert('RGBA')
            assert image.size==(1024,1024)
            assert list(image.getchannel('A').getbbox())==expected_bbox[mid]
            pixels=sum(1 for v in image.getchannel('A').getdata() if v)
            assert pixels==expected_pixels[mid]
            hashes[mid]=hashlib.sha256(data).hexdigest()

          manifest_path=root/'assets/modular_fighters/base_04/manifest.json'
          manifest=json.loads(manifest_path.read_text())
          for mid,digest in hashes.items():
            manifest['modules'][mid]['sha256']=digest
            manifest['modules'][mid]['source']['method']='deterministic_reviewed_v2_pixel_contract_materialized'
            manifest['modules'][mid]['source']['materializer']='C68.1 disposable GitHub Actions materializer'
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')

          contract_path=root/'assets/modular_fighters/base_04/production/BASE04_ARMOR_PACK_01_TAIJIFU_GUARD.json'
          contract=json.loads(contract_path.read_text())
          contract['expected_sha256']=hashes
          contract['art_review']['candidate_v2']['materialization']='deterministic_pixel_exact_crc_valid'
          contract_path.write_text(json.dumps(contract,indent=2,ensure_ascii=False)+'\n')
          print('C68_1_MATERIALIZED_BINARIES=PASS crc=true hashes='+json.dumps(hashes,sort_keys=True))
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Remove write-only generator from production head
        run: |
          set -euo pipefail
          rm -f tools/materialize_base04_taijifu_guard_v2.py

      - name: Commit valid immutable PNGs to production candidate
        env:
          BRANCH: agent/c68-1-armor-pack01-v2-final
        run: |
          set -euo pipefail
          git config user.name 'Tehkné Solutions Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'C68.1 materialize valid Taijifu Guard v2 binaries'
          git push origin "HEAD:${BRANCH}"

      - name: Summary
        run: echo 'C68.1 disposable materializer completed; exact v2 pixels committed as CRC-valid PNG binaries — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
