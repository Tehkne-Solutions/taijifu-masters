name: TGAP Installer

on:
  pull_request:
    paths:
      - 'scripts/tgap_install_bundle.py'
      - 'schemas/tgap/install-catalog.schema.json'
      - 'schemas/tgap/bundle-manifest.schema.json'
      - 'tests/tgap/test_transactional_installer.py'
      - 'docs/standards/TGAP_TRANSACTIONAL_INSTALLER.md'
  push:
    branches: [main]
    paths:
      - 'scripts/tgap_install_bundle.py'
      - 'schemas/tgap/install-catalog.schema.json'
      - 'tests/tgap/test_transactional_installer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-tgap.txt
            requirements-tgap-test.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-tgap.txt -r requirements-tgap-test.txt
      - name: Executar testes do instalador
        run: pytest -q tests/tgap/test_transactional_installer.py
