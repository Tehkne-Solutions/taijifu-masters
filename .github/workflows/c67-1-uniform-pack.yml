name: C67.1 BASE-03 Uniform Pack 01

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_03/**'
      - 'scripts/characters/modular_fighter_uniform_runtime.gd'
      - 'scripts/characters/modular_fighter_layer_policy.gd'
      - 'scripts/vertical_slice/first_playable_modular_fighter_presenter.gd'
      - 'scripts/ci/base03_uniform_pack_01_runtime_smoke.gd'
      - 'scripts/ci/base03_uniform_pack_01_visual_review.gd'
      - '.github/workflows/c67-1-uniform-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uniform-pack-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate exact BASE-03 uniform binaries and source invariants
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pillow==11.1.0
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          manifest = json.loads((root/'assets/modular_fighters/base_03/manifest.json').read_text())
          contract = json.loads((root/'assets/modular_fighters/base_03/production/BASE03_UNIFORM_PACK_01_LIAN_MARTIAL.json').read_text())
          assert manifest['pack_id'] == 'BASE03_MARTIAL_ARTS_UNIFORMS'
          assert manifest['version'].startswith('1.0.0')
          style = manifest['sets']['uniform_01_lian_martial']
          assert style['runtime_ready'] is True
          assert style['torso_inner'] is None and style['hands'] is None
          expected = contract['expected_sha256']
          assert len(expected) == 5
          for module_id, expected_sha in expected.items():
              module = manifest['modules'][module_id]
              path = root / module['path']
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == expected_sha == module['sha256'], (module_id, digest)
              image = Image.open(path).convert('RGBA')
              assert image.size == (1024, 1024)
              assert image.getchannel('A').getbbox() == tuple(module['alpha_bbox'])
              assert module['pivot'] == [0.5, 0.92]
          evidence = manifest['source_evidence']
          assert evidence['method'] == 'semantic_source_pixel_uniform_palette_body_matte_v4_final_sanitized'
          assert evidence['source_pixel_mutation'] is False
          assert evidence['redraw'] is False
          assert evidence['resampling'] is False
          assert all(value == 0 for value in evidence['contamination'].values())
          assert evidence['source_owner_visual_review'] == 'pass'
          promotion = manifest['promotion']
          if promotion['battle_activation']:
              assert style['production_ready'] is True
              assert promotion['runtime_validation'] == 'pass'
              assert promotion['owner_visual_review'] == 'pass'
              assert contract['status'] == 'production_approved_creator_control_pending'
              assert contract['promotion']['battle_activation'] is True
              assert contract['promotion']['battle_visual_review'] == 'pass'
          else:
              assert style['production_ready'] is False
              assert promotion['runtime_validation'] == 'pending'
              assert promotion['owner_visual_review'] == 'battle_capture_pending'
              assert contract['status'] == 'candidate_runtime_visual_review_pending'

          # C67.1's immutable production record correctly says Creator was still
          # blocked at that historical stage. Later C67.2+ may expose the same
          # approved pack only through an explicit Uniform Creator contract.
          assert contract['promotion']['creator_exposure'] is False
          if promotion['creator_exposure']:
              control_path = root/'assets/modular_fighters/base_03/production/BASE03_UNIFORM_CREATOR_CONTROL.json'
              assert control_path.is_file(), control_path
              control = json.loads(control_path.read_text())
              assert control['component_id'] == 'BASE03_UNIFORM_CREATOR_CONTROL'
              assert control['stage'] == 'C67.2'
              assert control['promotion']['creator_exposure'] is True
              assert manifest['status'] in (
                  'production_approved_creator_control_candidate_review_pending',
                  'production_approved_creator_control',
              )
          else:
              assert manifest['status'] == 'production_approved_creator_control_pending'
          print(f"C67_1_UNIFORM_BINARIES=PASS modules=5 exact_sha=true candidate={str(not promotion['battle_activation']).lower()} creator_exposure={str(bool(promotion['creator_exposure'])).lower()}")
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Ensure diagnostic and write-enabled workflows are absent from production branch
        run: |
          test ! -e .github/workflows/c67-1-uniform-source-feasibility.yml
          test ! -e .github/workflows/c67-1-uniform-promote-once.yml
          test ! -e tools/probe_base03_lian_uniform_source.py
          test ! -e tools/probe_base03_lian_uniform_source_v3.py
          test ! -e tools/probe_base03_lian_uniform_source_v4.py
          echo 'C67_1_DIAGNOSTIC_FILES=ABSENT'

      - name: Install Godot 4.3 and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c67-1-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed' c67-1-import.log; then
            echo 'C67_1_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Preserve C66 Hair runtime regression
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base02_hair_pack_01_runtime_smoke.gd 2>&1 | tee c67-1-c66-regression.log
          grep -q 'C66_1_HAIR_PACK_RUNTIME=PASS' c67-1-c66-regression.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C66_1_RUNTIME=BLOCKED' c67-1-c66-regression.log; then
            exit 1
          fi

      - name: Run Uniform pack profile assembler and battle smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base03_uniform_pack_01_runtime_smoke.gd 2>&1 | tee c67-1-runtime.log
          grep -q 'C67_1_PROFILE_ATOMIC_SET=PASS set=uniform_01_lian_martial modules=5 empty=2' c67-1-runtime.log
          grep -q 'C67_1_ASSEMBLER=PASS torso_outer_z=65 arms_z=12 waist_z=14 legs_z=11 feet_z=12' c67-1-runtime.log
          grep -q 'C67_1_PRESET_ROUNDTRIP=PASS' c67-1-runtime.log
          grep -q 'C67_1_BATTLE_RUNTIME=PASS set=uniform_01_lian_martial build=lian_wu' c67-1-runtime.log
          grep -q 'C67_1_UNIFORM_PACK_RUNTIME=PASS' c67-1-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C67_1_RUNTIME=BLOCKED' c67-1-runtime.log; then
            exit 1
          fi

      - name: Capture active-fight Uniform visual regression
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/ci/base03_uniform_pack_01_visual_review.gd \
            2>&1 | tee c67-1-visual.log
          grep -q 'C67_1_VISUAL_REVIEW=PASS set=uniform_01_lian_martial hair=hair_01_lian_topknot' c67-1-visual.log
          grep -q 'C67_1_VISUAL_LAYERING=PASS torso_outer=65 arms=12 waist=14 legs=11 feet=12' c67-1-visual.log
          grep -q 'C67_1_VISUAL_PHASE=PASS active_fight=true' c67-1-visual.log
          test -s artifacts/c67_1/C67_1_BASE03_LIAN_MARTIAL_UNIFORM.review-1920x1080.png
          if grep -Eq 'SCRIPT ERROR|Parse Error|C67_1_VISUAL=BLOCKED' c67-1-visual.log; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C67-1-BASE03-UNIFORM-PACK-01-EVIDENCE
          path: |
            c67-1-import.log
            c67-1-c66-regression.log
            c67-1-runtime.log
            c67-1-visual.log
            artifacts/c67_1/C67_1_BASE03_LIAN_MARTIAL_UNIFORM.review-1920x1080.png
            assets/modular_fighters/base_03/manifest.json
            assets/modular_fighters/base_03/production/BASE03_UNIFORM_PACK_01_LIAN_MARTIAL.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'C67.1 BASE-03 Uniform Pack 01 runtime + active-fight visual gate — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
