name: Ghost Rival Ranking CI

on:
  pull_request:
    paths:
      - 'scripts/runtime/ghost_rival_ranking_runtime.gd'
      - 'scripts/ci/ghost_rival_ranking_smoke_test.gd'
      - 'web/taijifu-ghost-rival-ranking-web.js'
      - 'scripts/inject-ghost-rival-ranking-web.py'
      - 'scripts/build-web.sh'
      - 'project.godot'
      - '.github/workflows/ghost-rival-ranking-ci.yml'

permissions:
  contents: read

jobs:
  validate-ranking:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Baixar Godot 4.3
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
      - name: Importar projeto completamente
        run: |
          set -o pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee godot-ranking-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Scan thread aborted|SHADER ERROR|Shader compilation failed|ERR_FILE_CORRUPT' godot-ranking-import.log; then
            exit 1
          fi
      - name: Validar ranking
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/ghost_rival_ranking_smoke_test.gd 2>&1 | tee godot-ranking.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' godot-ranking.log; then
            exit 1
          fi
      - name: Publicar logs quando houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-rival-ranking-ci-logs
          path: |
            godot-ranking-import.log
            godot-ranking.log

