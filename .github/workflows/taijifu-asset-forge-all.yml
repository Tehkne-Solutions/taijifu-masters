name: Taijifu Asset Forge All

on:
  pull_request:
    paths:
      - 'tools/asset_forge/**'
      - 'asset-forge/**'
      - 'tests/asset_forge/**'
      - '.github/workflows/taijifu-asset-forge-all.yml'
  push:
    branches: [main]
    paths:
      - 'tools/asset_forge/**'
      - 'asset-forge/**'
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tgap-test.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-tgap-test.txt
      - name: Testar orquestrador
        run: python -m pytest -q tests/asset_forge/test_orchestrator.py
      - name: Executar pipeline informativo
        run: python tools/asset_forge/orchestrator.py asset-forge/orchestration/pack_01_lian_wu_base.json
      - name: Publicar relatório consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-asset-forge-pack01-orchestration
          path: artifacts/asset-forge/pack_01_lian_wu_base__orchestration.json
          if-no-files-found: error
          retention-days: 30
