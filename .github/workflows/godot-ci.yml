name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-godot-project:
    name: Parser, importação e smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências do runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip \
            xvfb \
            libfontconfig1 \
            libgl1 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            libxi6

      - name: Baixar Godot 4.3 stable
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Importar projeto e concluir varredura de scripts
        run: |
          set -o pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee godot-import.log

      - name: Validar registro global de class_name
        run: |
          python scripts/ci/validate_global_class_registry.py | tee godot-class-registry.log

      - name: Instanciar cena principal e validar recursos
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/smoke_test.gd 2>&1 | tee godot-smoke.log

      - name: Validar sistema competitivo
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/competitive_smoke_test.gd 2>&1 | tee godot-competitive.log

      - name: Validar presets, histórico e identidade visual
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/presets_history_smoke_test.gd 2>&1 | tee godot-presets-history.log

      - name: Validar arenas, códigos compactos e torneio
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/arena_share_tournament_smoke_test.gd 2>&1 | tee godot-arena-share-tournament.log

      - name: Validar torneio de oito, replay e filtros
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/tournament_replay_history_smoke_test.gd 2>&1 | tee godot-tournament-replay-history.log

      - name: Validar nomes, exportação, ranking e curadoria
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/tournament_curation_ranking_smoke_test.gd 2>&1 | tee godot-tournament-curation-ranking.log

      - name: Validar perfis, busca, comparação e PNG
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/profiles_search_compare_png_smoke_test.gd 2>&1 | tee godot-profiles-search-compare-png.log

      - name: Validar temporadas, perfis e fase de grupos
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/seasons_profiles_groups_smoke_test.gd 2>&1 | tee godot-seasons-profiles-groups.log

      - name: Validar dupla eliminação e reset da final
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/double_elimination_smoke_test.gd 2>&1 | tee godot-double-elimination.log

      - name: Validar ponte Web, pausa e remapeamento
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/web_platform_bridge_smoke_test.gd 2>&1 | tee godot-web-platform-bridge.log

      - name: Validar curvas, gatilhos, vibração e dojo avançado
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/gamepad_experience_smoke_test.gd 2>&1 | tee godot-gamepad-experience.log

      - name: Validar perfis GUID, curva visual e combo dojo
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/controller_mastery_smoke_test.gd 2>&1 | tee godot-controller-mastery.log

      - name: Validar gravação, fantasma, desafios e certificações
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/input_ghost_mastery_smoke_test.gd 2>&1 | tee godot-input-ghost-mastery.log

      - name: Validar compartilhamento, checksum e importação segura
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/ghost_sharing_smoke_test.gd 2>&1 | tee godot-ghost-sharing.log

      - name: Validar biblioteca, seleção e remoção de fantasmas
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/ghost_library_smoke_test.gd 2>&1 | tee godot-ghost-library.log

      - name: C28 validar Training Rival 44/44 em runtime
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/c28-training-rival-44-import')
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/training_rival_c28_runtime_bench.gd 2>&1 | tee godot-c28-training-rival.log
          grep -q 'VM02_C28_GODOT_SPRITEFRAMES=PASS animations=10 frames=44' godot-c28-training-rival.log
          grep -q 'VM02_C28_PRESENTER_ACTIVATION=PASS using_real_assets=true' godot-c28-training-rival.log
          grep -q 'VM02_C28_GODOT_RUNTIME_BENCH=PASS' godot-c28-training-rival.log
          grep -q 'VM02_C28_PROXY_RETIREMENT=BLOCKED code_fallback_preserved=true' godot-c28-training-rival.log

      - name: Publicar evidência C28 Training Rival
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/c28-training-rival-44-import')
        uses: actions/upload-artifact@v4
        with:
          name: C28-TRAINING-RIVAL-44-RUNTIME-BENCH
          path: |
            godot-c28-training-rival.log
            assets/tgap/training_rival/first_playable_lot_01/c28-import-manifest.json
            assets/tgap/training_rival/first_playable_lot_01/training_rival_first_playable_frames.tres
          if-no-files-found: ignore

      - name: C68.1 validar Armor Pack 01 em runtime de luta
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/c68-1-armor-pack01-v2')
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/base04_armor_pack_01_runtime_smoke.gd 2>&1 | tee godot-c68-1-armor-runtime.log
          grep -q 'C68_1_ARMOR_PACK_RUNTIME=PASS' godot-c68-1-armor-runtime.log

      - name: C68.1 capturar compatibilidade visual ativa
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/c68-1-armor-pack01-v2')
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://scripts/ci/base04_armor_pack_01_visual_review.gd 2>&1 | tee godot-c68-1-armor-visual.log
          grep -q 'C68_1_VISUAL_REVIEW=PASS' godot-c68-1-armor-visual.log
          test -s artifacts/c68_1/C68_1_BASE04_TAIJIFU_GUARD.review-1920x1080.png

      - name: Publicar evidência C68.1
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/c68-1-armor-pack01-v2')
        uses: actions/upload-artifact@v4
        with:
          name: C68-1-BASE04-ARMOR-PACK-01-EVIDENCE
          path: |
            godot-c68-1-armor-runtime.log
            godot-c68-1-armor-visual.log
            artifacts/c68_1/C68_1_BASE04_TAIJIFU_GUARD.review-1920x1080.png
          if-no-files-found: ignore

      - name: Publicar logs quando houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: |
            godot-import.log
            godot-class-registry.log
            godot-smoke.log
            godot-competitive.log
            godot-presets-history.log
            godot-arena-share-tournament.log
            godot-tournament-replay-history.log
            godot-tournament-curation-ranking.log
            godot-profiles-search-compare-png.log
            godot-seasons-profiles-groups.log
            godot-double-elimination.log
            godot-web-platform-bridge.log
            godot-gamepad-experience.log
            godot-controller-mastery.log
            godot-input-ghost-mastery.log
            godot-ghost-sharing.log
            godot-ghost-library.log
            godot-c28-training-rival.log
            godot-c68-1-armor-runtime.log
            godot-c68-1-armor-visual.log
          if-no-files-found: ignore
