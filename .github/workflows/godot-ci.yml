name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-godot-project:
    name: Parser, importação e smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências do runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip \
            libfontconfig1 \
            libgl1 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            libxi6

      - name: Baixar Godot 4.3 stable
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Importar projeto e validar parser
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log

      - name: Instanciar cena principal e validar recursos
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/smoke_test.gd 2>&1 | tee godot-smoke.log

      - name: Validar sistema competitivo
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/competitive_smoke_test.gd 2>&1 | tee godot-competitive.log

      - name: Validar presets, histórico e identidade visual
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/presets_history_smoke_test.gd 2>&1 | tee godot-presets-history.log

      - name: Validar arenas, códigos compactos e torneio
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/arena_share_tournament_smoke_test.gd 2>&1 | tee godot-arena-share-tournament.log

      - name: Validar torneio de oito, replay e filtros
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/tournament_replay_history_smoke_test.gd 2>&1 | tee godot-tournament-replay-history.log

      - name: Validar nomes, exportação, ranking e curadoria
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/tournament_curation_ranking_smoke_test.gd 2>&1 | tee godot-tournament-curation-ranking.log

      - name: Validar perfis, busca, comparação e PNG
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/profiles_search_compare_png_smoke_test.gd 2>&1 | tee godot-profiles-search-compare-png.log

      - name: Publicar logs quando houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: |
            godot-import.log
            godot-smoke.log
            godot-competitive.log
            godot-presets-history.log
            godot-arena-share-tournament.log
            godot-tournament-replay-history.log
            godot-tournament-curation-ranking.log
            godot-profiles-search-compare-png.log
          if-no-files-found: ignore
