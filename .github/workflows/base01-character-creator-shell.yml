name: BASE-01 Character Creator Shell

on:
  pull_request:
    paths:
      - 'scripts/characters/modular_fighter_creator_shell.gd'
      - 'scripts/characters/modular_fighter_creator_scene.gd'
      - 'scenes/characters/modular_fighter_creator_shell.tscn'
      - 'scripts/ci/base01_character_creator_shell_smoke.gd'
      - 'scripts/runtime/base01_character_creator_shell_bench.gd'
      - 'scripts/characters/modular_fighter_identity_selector.gd'
      - 'scripts/characters/modular_fighter_preset_store.gd'
      - 'assets/modular_fighters/base_01/production/BASE01_CHARACTER_CREATOR_SHELL.json'
      - '.github/workflows/base01-character-creator-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-creator-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - name: Validate C62.6 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('assets/modular_fighters/base_01/production/BASE01_CHARACTER_CREATOR_SHELL.json').read_text())
          assert c['signature']=='Tehkné Solutions'
          assert c['status']=='character_creator_shell_integrated_owner_review_pending'
          assert c['scene_contract']['scene']=='scenes/characters/modular_fighter_creator_shell.tscn'
          assert c['scene_contract']['behavior_controller']=='scripts/characters/modular_fighter_creator_shell.gd'
          assert c['scene_contract']['scene_controller']=='scripts/characters/modular_fighter_creator_scene.gd'
          assert c['scene_contract']['live_preview'] is True
          assert c['scene_contract']['canonical_pivot']==[0.5,0.92]
          assert c['scene_contract']['reviewed_preview_scale']==0.20
          assert c['scene_contract']['preview_controls_overlap'] is False
          assert c['identity_contract']['total_options']==24
          assert c['identity_contract']['face_plate_internal'] is True
          assert c['preset_contract']['schema']=='tehkne/taijifu-modular-fighter-preset/v2'
          assert c['preset_contract']['legacy_v1_read_boundary'] is True
          assert c['preset_contract']['legacy_v1_edit_coercion'] is False
          assert c['ux_contract']['keyboard_gamepad_focus'] is True
          assert c['ux_contract']['visual_language']=='dark_martial_bronze_no_tech_glow'
          assert c['review']['machine']=='PASS'
          assert c['review']['runtime_roundtrip']=='PASS'
          assert c['review']['live_preview']=='PASS'
          assert c['review']['preset_list_runtime_proof']=='PASS'
          assert c['review']['internal_visual']=='PASS'
          assert c['review']['owner_review']=='PENDING'
          print('C62_6_CREATOR_CONTRACT=PASS options=24 state=integrated')
          PY

      - name: Install Godot 4.3 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import creator shell fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c62-6-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-6-import.log; then
            echo 'C62_6_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run creator shell smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base01_character_creator_shell_smoke.gd 2>&1 | tee c62-6-runtime.log
          grep -q 'C62_6_CREATOR_SHELL=PASS options=24 preview=live' c62-6-runtime.log
          grep -q 'C62_6_CREATOR_PRESET_ROUNDTRIP=PASS name=skin=face=eyes=brows' c62-6-runtime.log
          grep -q 'C62_6_CREATOR_RUNTIME_SYNC=PASS face_plate=auto' c62-6-runtime.log
          grep -q 'C62_6_MISSING_PRESET=BLOCKED' c62-6-runtime.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-6-runtime.log; then
            echo 'C62_6_RUNTIME_ERRORS=BLOCKED'
            exit 1
          fi

      - name: Render creator shell review
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --rendering-method gl_compatibility --resolution 1280x720 --script res://scripts/runtime/base01_character_creator_shell_bench.gd 2>&1 | tee c62-6-visual.log
          grep -q 'C62_6_CREATOR_VISUAL=PASS size=1920x1080 options=24' c62-6-visual.log
          grep -q 'C62_6_CREATOR_LIVE_PREVIEW=PASS face_plate=auto overlap=false' c62-6-visual.log
          grep -q 'C62_6_CREATOR_PRESET_LIST=PASS id=mestre_do_caminho' c62-6-visual.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-6-visual.log; then
            echo 'C62_6_VISUAL_ERRORS=BLOCKED'
            exit 1
          fi

      - name: Assert creator artifact
        run: |
          set -euo pipefail
          test -s artifacts/c62-6/BASE01_CHARACTER_CREATOR_SHELL.review-1920x1080.png
          test -s artifacts/c62-6/BASE01_CHARACTER_CREATOR_SHELL.qa.json
          python - <<'PY'
          import json, struct
          from pathlib import Path
          png=Path('artifacts/c62-6/BASE01_CHARACTER_CREATOR_SHELL.review-1920x1080.png').read_bytes()
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', png[16:24])==(1920,1080)
          qa=json.loads(Path('artifacts/c62-6/BASE01_CHARACTER_CREATOR_SHELL.qa.json').read_text())
          assert qa['status']=='implementation_candidate_owner_review_pending'
          assert qa['identity_options']==24
          assert qa['live_preview']=='PASS'
          assert qa['face_plate_policy']=='PASS'
          assert qa['preset_controls_visible'] is True
          assert qa['preset_list_runtime_proof']=='PASS'
          assert qa['preview_controls_overlap'] is False
          assert qa['keyboard_gamepad_focus']=='PASS'
          assert qa['owner_review']=='PENDING'
          print('C62_6_CREATOR_ARTIFACT=PASS size=1920x1080 overlap=false')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BASE01-CHARACTER-CREATOR-SHELL-REVIEW
          path: |
            artifacts/c62-6/BASE01_CHARACTER_CREATOR_SHELL.review-1920x1080.png
            artifacts/c62-6/BASE01_CHARACTER_CREATOR_SHELL.qa.json
            c62-6-import.log
            c62-6-runtime.log
            c62-6-visual.log
          if-no-files-found: ignore

      - name: Summary
        run: echo 'C62.6 BASE-01 Character Creator Shell PASS — integrated, owner review pending — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
