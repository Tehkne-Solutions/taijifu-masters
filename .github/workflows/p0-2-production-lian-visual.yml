name: P0.2 Production Lian Visual

on:
  pull_request:
    paths:
      - 'scripts/vertical_slice/first_playable_session.gd'
      - 'scripts/vertical_slice/first_playable_lot01_presenter.gd'
      - 'scripts/vertical_slice/first_playable_modular_fighter_presenter.gd'
      - 'scripts/vertical_slice/first_playable_skeletal_modular_fighter_presenter.gd'
      - 'scripts/vertical_slice/first_playable_modular_pose_runtime.gd'
      - 'scripts/characters/modular_fighter_pose_rig.gd'
      - 'scripts/characters/modular_fighter_hair_runtime.gd'
      - 'scripts/characters/modular_fighter_uniform_runtime.gd'
      - 'scripts/characters/modular_fighter_armor_runtime.gd'
      - 'scripts/characters/modular_fighter_equipment_runtime.gd'
      - 'assets/modular_fighters/base_0*/**'
      - 'tests/p0_2_production_lian_visual_product_test.gd'
      - 'scripts/ci/p0_2_production_lian_visual_review.gd'
      - '.github/workflows/p0-2-production-lian-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-lian-visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Materialize canonical First Playable snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-p02-lian'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath p0-2-lian-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require canonical snapshot authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VM02_C30_SOURCE_PIN=PASS' p0-2-lian-c30.log
          grep -q 'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89' p0-2-lian-c30.log
          grep -q 'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS' p0-2-lian-c30.log
          echo 'P0_2_PRODUCTION_LIAN_CANONICAL_SNAPSHOT=PASS'

      - name: Install visual runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee p0-2-lian-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' p0-2-lian-import.log; then
            echo 'P0_2_PRODUCTION_LIAN_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run complete production profile product gate
        run: |
          set -o pipefail
          timeout 60s ./godot --headless --audio-driver Dummy --path . \
            --script res://tests/p0_2_production_lian_visual_product_test.gd \
            2>&1 | tee p0-2-lian-product.log
          grep -q 'P0_2_PRODUCTION_LIAN_PROFILE=PASS' p0-2-lian-product.log
          grep -q 'P0_2_PRODUCTION_LIAN_COMPOSITION=PASS hair=hair_01_lian_topknot uniform=uniform_01_lian_martial armor=armor_01_taijifu_guard back=back_01_guardian_panel weapon_set=weapon_01_lian_serene_katana' p0-2-lian-product.log
          grep -q 'P0_2_PRODUCTION_LIAN_COMBAT_OWNER=PASS loadout=combat_lian_wu_first_playable visual_weapon=katana_lian_wu' p0-2-lian-product.log
          grep -q 'P0_2_PRODUCTION_LIAN_FALLBACK=PASS lot01=preserved_hidden' p0-2-lian-product.log
          grep -q 'P0_2_PRODUCTION_LIAN_MESH_PARITY=PASS' p0-2-lian-product.log
          grep -q 'P0_2_PRODUCTION_LIAN_PRODUCT_GATE=PASS' p0-2-lian-product.log
          grep -q 'SIGNATURE=Tehkné Solutions' p0-2-lian-product.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error|P0_2_PRODUCTION_LIAN_GATE=BLOCKED' p0-2-lian-product.log; then
            echo 'P0_2_PRODUCTION_LIAN_PRODUCT_GATE=BLOCKED runtime_error'
            exit 1
          fi

      - name: Capture neutral and attack production Lian evidence
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/ci/p0_2_production_lian_visual_review.gd \
            2>&1 | tee p0-2-lian-visual.log
          grep -q 'P0_2_PRODUCTION_LIAN_VISUAL_STACK=PASS' p0-2-lian-visual.log
          grep -q 'P0_2_PRODUCTION_LIAN_WEAPON_VISIBILITY=PASS neutral=false attack=true bridge=Sprite2D_to_Polygon2D' p0-2-lian-visual.log
          grep -q 'P0_2_PRODUCTION_LIAN_NEUTRAL_CAPTURE=' p0-2-lian-visual.log
          grep -q 'P0_2_PRODUCTION_LIAN_ATTACK_CAPTURE=' p0-2-lian-visual.log
          grep -q 'P0_2_PRODUCTION_LIAN_VISUAL_REVIEW=PASS' p0-2-lian-visual.log
          grep -q 'SIGNATURE=Tehkné Solutions' p0-2-lian-visual.log
          test -f artifacts/p0_2_lian/P0_2_PRODUCTION_LIAN.neutral-1920x1080.png
          test -f artifacts/p0_2_lian/P0_2_PRODUCTION_LIAN.attack-1920x1080.png
          test -f artifacts/p0_2_lian/P0_2_PRODUCTION_LIAN_METRICS.json
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error|P0_2_PRODUCTION_LIAN_REVIEW=BLOCKED' p0-2-lian-visual.log; then
            echo 'P0_2_PRODUCTION_LIAN_VISUAL_REVIEW=BLOCKED runtime_error'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0-2-PRODUCTION-LIAN-VISUAL-EVIDENCE
          path: |
            p0-2-lian-c30.log
            p0-2-lian-import.log
            p0-2-lian-product.log
            p0-2-lian-visual.log
            artifacts/p0_2_lian/P0_2_PRODUCTION_LIAN.neutral-1920x1080.png
            artifacts/p0_2_lian/P0_2_PRODUCTION_LIAN.attack-1920x1080.png
            artifacts/p0_2_lian/P0_2_PRODUCTION_LIAN_METRICS.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'P0.2 production Lian — complete BASE-01..05 stack + neutral/attack graphical evidence — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"

# Tehkné Solutions