name: TGAP Runtime Smoke

on:
  pull_request:
    paths:
      - "project.godot"
      - "scripts/runtime/**"
      - "scenes/**"
      - "assets/tgap/**"
      - "tests/tgap/**"
      - ".github/workflows/tgap-runtime-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Run TGAP contract tests
        run: python -m pytest tests/tgap/test_runtime_smoke_contract.py tests/tgap/test_legacy_autoload_removed.py

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: ./godot --headless --editor --path . --quit-after 2

      - name: Run TGAP runtime smoke
        run: ./godot --headless --path . --script tests/tgap/runtime_smoke_test.gd

      - name: Enforce zero legacy production usage
        run: python scripts/tgap_audit_legacy_usage.py --fail-on-findings
