name: C56.4 Canonical Binary Reconstruction

on:
  push:
    branches:
      - agent/c56-canonical-direct-v2
    paths:
      - 'tools/c56_transport_v2/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact audited PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/modular_fighters/base_01/face assets/modular_fighters/base_01/eyes assets/modular_fighters/base_01/brows
          cat tools/c56_transport_v2/face_00.b64 tools/c56_transport_v2/face_01.b64 | base64 -d > assets/modular_fighters/base_01/face/face_01_balanced.png
          cat tools/c56_transport_v2/eyes_00.b64 tools/c56_transport_v2/eyes_01.b64 tools/c56_transport_v2/eyes_02.b64 tools/c56_transport_v2/eyes_03.b64 tools/c56_transport_v2/eyes_04.b64 | base64 -d > assets/modular_fighters/base_01/eyes/eyes_01_focused.png
          cat tools/c56_transport_v2/brows_00.b64 tools/c56_transport_v2/brows_01.b64 | base64 -d > assets/modular_fighters/base_01/brows/brows_01_focused.png
          test "$(sha256sum assets/modular_fighters/base_01/face/face_01_balanced.png | awk '{print $1}')" = "d8bc0218b6104d2095e20a074fa4e0a23d428d1bf71e91fcac7139374b3504d9"
          test "$(sha256sum assets/modular_fighters/base_01/eyes/eyes_01_focused.png | awk '{print $1}')" = "7517e6d14cef106fbe782736524321b992ea3088486498fc24e71f1e158419a9"
          test "$(sha256sum assets/modular_fighters/base_01/brows/brows_01_focused.png | awk '{print $1}')" = "44fa5d30e0963582b5cf2d877b7a61a6d68f8028b9a2da19cbba9a73afc80225"
          git config user.name "Tehkne Solutions Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -rf tools/c56_transport_v2
          rm -f .github/workflows/c56-canonical-direct-v2.yml
          git add -A assets/modular_fighters/base_01 tools/c56_transport_v2 .github/workflows/c56-canonical-direct-v2.yml
          git commit -m "fix(c56.4): publish canonical BASE-01 identity binaries"
          git push origin HEAD:agent/c56-canonical-direct-v2
          echo C56_4_CANONICAL_BINARIES=PASS
