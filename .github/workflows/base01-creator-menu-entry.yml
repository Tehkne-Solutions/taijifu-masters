name: BASE-01 Creator Menu Entry

on:
  pull_request:
    paths:
      - 'scripts/vertical_slice/first_playable_menu.gd'
      - 'scenes/vertical_slice/first_playable_menu.tscn'
      - 'scripts/ci/base01_creator_menu_entry_smoke.gd'
      - 'scripts/runtime/base01_creator_menu_entry_bench.gd'
      - 'tests/first_playable_flow_test.gd'
      - 'scenes/characters/modular_fighter_creator_shell.tscn'
      - 'assets/modular_fighters/base_01/production/BASE01_CREATOR_MENU_ENTRY.json'
      - '.github/workflows/base01-creator-menu-entry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-menu-entry:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - name: Validate C62.7 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('assets/modular_fighters/base_01/production/BASE01_CREATOR_MENU_ENTRY.json').read_text())
          assert c['signature']=='Tehkné Solutions'
          assert c['status']=='creator_menu_entry_integrated_owner_review_pending'
          e=c['entry_contract']
          assert e['creator_scene']=='scenes/characters/modular_fighter_creator_shell.tscn'
          assert e['button_path']=='Content/Actions/CreatorButton'
          assert e['button_label']=='CRIAR LUTADOR'
          assert e['keyboard_shortcut']=='C'
          assert e['role']=='secondary_non_blocking'
          r=c['regression_contract']
          assert r['main_action']=='play_vs_ai'
          assert r['play_initial_focus'] is True
          assert r['quick_game_path_unchanged'] is True
          assert r['difficulty_selection_unchanged'] is True
          assert r['participant_form_absent'] is True
          assert r['legacy_prototype_absent'] is True
          assert r['existing_first_playable_flow_test_required'] is True
          review=c['review']
          assert review['machine']=='PASS'
          assert review['existing_first_playable_flow']=='PASS'
          assert review['creator_runtime_entry']=='PASS'
          assert review['internal_visual']=='PASS'
          assert review['owner_review']=='PENDING'
          print('C62_7_MENU_ENTRY_CONTRACT=PASS role=secondary_non_blocking state=integrated')
          PY

      - name: Install Godot 4.3 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import menu and creator fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c62-7-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-7-import.log; then
            echo 'C62_7_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Preserve existing First Playable flow
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/first_playable_flow_test.gd 2>&1 | tee c62-7-first-playable.log
          grep -q 'FIRST_PLAYABLE_FLOW_OK' c62-7-first-playable.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' c62-7-first-playable.log; then
            echo 'C62_7_FIRST_PLAYABLE_REGRESSION=BLOCKED'
            exit 1
          fi

      - name: Run creator menu entry smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base01_creator_menu_entry_smoke.gd 2>&1 | tee c62-7-runtime.log
          grep -q 'C62_7_CREATOR_MENU_ENTRY=PASS target=BASE01_CHARACTER_CREATOR_SHELL' c62-7-runtime.log
          grep -q 'C62_7_QUICK_GAME_REGRESSION=PASS main_action=play_vs_ai focus=play' c62-7-runtime.log
          grep -q 'C62_7_CREATOR_SHORTCUT=PASS key=C' c62-7-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' c62-7-runtime.log; then
            echo 'C62_7_RUNTIME_ERRORS=BLOCKED'
            exit 1
          fi

      - name: Render creator menu review
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --rendering-method gl_compatibility --resolution 1280x720 --script res://scripts/runtime/base01_creator_menu_entry_bench.gd 2>&1 | tee c62-7-visual.log
          grep -q 'C62_7_MENU_VISUAL=PASS size=1920x1080' c62-7-visual.log
          grep -q 'C62_7_CREATOR_ENTRY_VISUAL=PASS focus=creator role=secondary_non_blocking' c62-7-visual.log
          grep -q 'C62_7_QUICK_GAME_VISUAL=PASS play_primary=true' c62-7-visual.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' c62-7-visual.log; then
            echo 'C62_7_VISUAL_ERRORS=BLOCKED'
            exit 1
          fi

      - name: Assert menu review artifact
        run: |
          set -euo pipefail
          test -s artifacts/c62-7/BASE01_CREATOR_MENU_ENTRY.review-1920x1080.png
          test -s artifacts/c62-7/BASE01_CREATOR_MENU_ENTRY.qa.json
          python - <<'PY'
          import json, struct
          from pathlib import Path
          png=Path('artifacts/c62-7/BASE01_CREATOR_MENU_ENTRY.review-1920x1080.png').read_bytes()
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', png[16:24])==(1920,1080)
          qa=json.loads(Path('artifacts/c62-7/BASE01_CREATOR_MENU_ENTRY.qa.json').read_text())
          assert qa['status']=='implementation_candidate_owner_review_pending'
          assert qa['main_action']=='play_vs_ai'
          assert qa['play_primary'] is True
          assert qa['creator_entry']=='CRIAR LUTADOR'
          assert qa['creator_role']=='secondary_non_blocking'
          assert qa['creator_focus_review']=='PASS'
          assert qa['quick_game_path_unchanged']=='PASS'
          assert qa['participant_form_absent'] is True
          assert qa['legacy_prototype_absent'] is True
          assert qa['owner_review']=='PENDING'
          print('C62_7_MENU_REVIEW_ARTIFACT=PASS size=1920x1080')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BASE01-CREATOR-MENU-ENTRY-REVIEW
          path: |
            artifacts/c62-7/BASE01_CREATOR_MENU_ENTRY.review-1920x1080.png
            artifacts/c62-7/BASE01_CREATOR_MENU_ENTRY.qa.json
            c62-7-import.log
            c62-7-first-playable.log
            c62-7-runtime.log
            c62-7-visual.log
          if-no-files-found: ignore

      - name: Summary
        run: echo 'C62.7 BASE-01 Creator Menu Entry PASS — integrated, owner review pending — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
