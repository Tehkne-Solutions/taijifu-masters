name: C68.3 BASE-04 Back Accessory Art Review

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_04/**'
      - '.github/workflows/c68-3-base04-back-accessory-art-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art-review-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable C68.3 art decision across later runtime promotion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('assets/modular_fighters/base_04/manifest.json').read_text())
          c=json.loads(Path('assets/modular_fighters/base_04/production/BASE04_BACK_ACCESSORY_PACK_01_ART_REVIEW.json').read_text())
          x=json.loads(Path('assets/modular_fighters/base_04/candidates/back_accessory_pack_01/candidates.json').read_text())
          assert c['stage']=='C68.3' and c['candidate_count']==3
          assert c['selection_unit']=='back_accessory' and c['slot']=='back_accessory' and c['layer']==4
          direction=c['art_direction']
          assert direction['connected_single_object_required'] is True
          assert direction['large_mmo_cape_forbidden'] is True
          assert direction['disconnected_two_strip_silhouette_forbidden'] is True
          assert direction['native_transparency_required'] is True
          assert list(c['candidate_briefs'])==['v1_guardian_yoke','v2_martial_knot','v3_guardian_panel']
          matrix=c['compatibility_matrix']
          assert matrix['reference_hair']=='hair_01_lian_topknot'
          assert matrix['reference_uniform']=='uniform_01_lian_martial'
          assert matrix['reference_armor']=='armor_01_taijifu_guard'
          assert matrix['reference_weapon_back']=='sheath_lian_wu_blue'
          assert [matrix['weapon_back_layer'],matrix['back_accessory_layer'],matrix['hair_back_layer']]==[3,4,5]
          assert matrix['must_review_authored_facing'] is True
          assert matrix['must_review_flipped_facing'] is True
          assert matrix['must_review_gameplay_scale'] is True
          assert c['selection_review']['selected_candidate']=='v3_guardian_panel'
          assert x['selection']['selected_candidate']=='v3_guardian_panel'
          assert c['rejected_history']['c68_1_candidate_v1_back']['must_not_reintroduce'] is True
          assert c['rejected_history']['c68_3_v2_martial_knot']['must_not_promote'] is True
          selected=x['candidates']['v3_guardian_panel']
          assert m['promotion']['back_accessory_creator_exposure'] is False
          if m['promotion']['back_accessory_runtime_activation']:
              entry=m['back_accessories']['back_01_guardian_panel']
              assert entry['runtime_ready'] is True and entry['production_ready'] is True
              mod=m['modules'][entry['back_accessory']]
              assert mod['sha256']==selected['sha256']
              assert hashlib.sha256(Path(mod['path']).read_bytes()).hexdigest()==selected['sha256']
              state='runtime_promoted'
          else:
              assert list(m['back_accessories'])==['back_none']
              state='art_selected'
          print('C68_3_ART_SELECTION=PASS selected=v3_guardian_panel v2=rejected')
          print('C68_3_ART_IMMUTABILITY=PASS state='+state)
          print('C68_3_CREATOR_GUARD=PASS back_accessory_creator=false')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Summary
        run: echo 'C68.3 immutable Back Accessory art decision — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
