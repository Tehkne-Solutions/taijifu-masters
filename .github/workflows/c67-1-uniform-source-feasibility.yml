name: C67.1 Uniform Source Feasibility Probe

on:
  pull_request:
    paths:
      - 'tools/probe_base03_lian_uniform_source.py'
      - 'tools/probe_base03_lian_uniform_source_v3.py'
      - '.github/workflows/c67-1-uniform-source-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-feasibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: pip install --disable-pip-version-check pillow==11.1.0

      - name: Probe exact Lian uniform source against BASE-00 and Hair
        run: |
          set -euo pipefail
          python tools/probe_base03_lian_uniform_source_v3.py 2>&1 | tee c67-1-uniform-source-probe.log
          grep -q 'C67_1_UNIFORM_SOURCE_PROBE=PASS method=semantic_v3' c67-1-uniform-source-probe.log
          grep -q 'C67_1_CONTAMINATION=PASS skin=0 hair=0 hands_weapon=0 collar=0 boot_spill=0 baseline_shadow=0' c67-1-uniform-source-probe.log
          grep -q 'C67_1_HAIR_INTERACTION=MEASURED' c67-1-uniform-source-probe.log
          grep -q 'C67_1_PRODUCTION_PROMOTION=BLOCKED owner_visual_review_required' c67-1-uniform-source-probe.log
          test -s artifacts/c67_1_uniform_source_probe/C67_1_LIAN_UNIFORM_SOURCE_FEASIBILITY.contact.png
          test -s artifacts/c67_1_uniform_source_probe/C67_1_UNIFORM_SLOT_SPLIT.contact.png
          test -s artifacts/c67_1_uniform_source_probe/09_base00_hair_uniform_composition_FULL_CANVAS_DIAGNOSTIC.png
          test -s artifacts/c67_1_uniform_source_probe/10_base00_hair_uniform_gameplay_132px.png
          test -s artifacts/c67_1_uniform_source_probe/report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/c67_1_uniform_source_probe/report.json').read_text())
          assert data['schema']=='tehkne/taijifu-c67-1-uniform-source-feasibility/v3'
          candidate=data['candidate']
          assert candidate['selection']=='semantic_source_pixel_uniform_palette_body_matte_v3_spatial_sanitized'
          assert candidate['changed_pixel_dependency'] is False
          assert candidate['source_pixel_mutation'] is False
          assert candidate['redraw'] is False
          assert candidate['resampling'] is False
          assert candidate['slot_overlap_pixels']=={}
          assert candidate['nonempty_slots']
          for key in (
              'skin_like_pixels',
              'approved_hair_overlap_pixels',
              'left_hand_weapon_zone_pixels',
              'right_hand_zone_pixels',
              'warm_collar_pixels',
              'feet_outside_boot_zones_pixels',
              'feet_low_alpha_baseline_pixels',
          ):
              assert candidate[key]==0, (key,candidate[key])
          comp=data['composition']
          assert comp['gameplay_review_height_px']==132
          policy=data['policy']
          assert policy['automatic_uniform_promotion_allowed'] is False
          assert policy['hair_interaction_visual_review_required'] is True
          assert policy['layer_policy_change_allowed_from_metrics_only'] is False
          print('C67_1_DIAGNOSTIC_CONTRACT=PASS method=semantic_v3 contamination=0')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C67-1-UNIFORM-SOURCE-FEASIBILITY
          path: |
            c67-1-uniform-source-probe.log
            artifacts/c67_1_uniform_source_probe/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: echo 'C67.1 diagnostic v3 only — sanitized exact source pixels, no production promotion — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
