name: First Playable Windows Build

on:
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "config/v2-arena-intake-contract.json"
      - "tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1"
      - "tests/first_playable*.gd"
      - ".github/workflows/first-playable-windows-build.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-playable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Exportar First Playable Windows x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materializar snapshot canônico do First Playable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-windows-build'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath first-playable-windows-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content first-playable-windows-c30.log -Raw
          foreach ($required in @(
            'VM02_C30_SOURCE_PIN=PASS',
            'VM02_C30_SNAPSHOT_FREEZE=PASS',
            'VM02_C30_SNAPSHOT_LIAN=PASS frames=45 animations=10',
            'VM02_C30_SNAPSHOT_RIVAL=PASS frames=44 animations=10',
            'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89',
            'VM02_C30_SNAPSHOT_STAGE=PASS layers=3',
            'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS',
            'VM02_C30_ARENA_CANONICAL_READY=PASS'
          )) {
            if (-not $log.Contains($required)) { throw "FIRST_PLAYABLE_WINDOWS_SNAPSHOT=BLOCKED missing=$required" }
          }
          Write-Host 'FIRST_PLAYABLE_WINDOWS_SNAPSHOT=PASS ref=assets-first-playable-v1.0.0 fighters=89 stage_layers=3'

      - name: Cache Godot e templates
        uses: actions/cache@v4
        with:
          path: |
            .cache/godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-stable-export-templates-v1

      - name: Exportar e empacotar Windows
        env:
          GODOT_VERSION: "4.3"
          GODOT_CHANNEL: stable
        run: |
          set -o pipefail
          bash scripts/build-windows.sh 2>&1 | tee first-playable-windows-build.log

      - name: Validar manifesto e pacote
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("windows-build/build-info.json")
          zip_path = Path("dist/Taijifu-Masters-First-Playable-Windows-x86_64.zip")
          checksum_path = Path(str(zip_path) + ".sha256")
          executable = Path("windows-build/Taijifu-Masters-First-Playable.exe")

          assert manifest_path.is_file(), manifest_path
          assert zip_path.is_file() and zip_path.stat().st_size > 0, zip_path
          assert checksum_path.is_file(), checksum_path
          assert executable.is_file() and executable.stat().st_size > 0, executable

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schema"] == "tehkne/taijifu-first-playable-build/v1"
          assert manifest["platform"] == "windows"
          assert manifest["channel"] == "external-playtest"
          assert manifest["version"] == "0.2.3-playtest"
          assert manifest["main_scene"] == "res://scenes/vertical_slice/first_playable_menu.tscn"
          assert manifest["signature"] == "Tehkné Solutions"
          assert manifest["totals"]["file_count"] >= 3
          assert any(item["path"].endswith(".exe") for item in manifest["files"])

          snapshot = manifest["asset_snapshot"]
          assert snapshot["schema"] == "tehkne/taijifu-first-playable-asset-snapshot/v1"
          assert snapshot["signature"] == "Tehkné Solutions"
          assert snapshot["tag"] == "assets-first-playable-v1.0.0"
          assert snapshot["commit"] == "b6767d9d30fb2980de5d0a57a8a4c414b854cad5"
          assert snapshot["archive"] == "TAIJIFU_FIRST_PLAYABLE_ASSETS_v1.0.0.zip"
          assert snapshot["archive_sha256"] == "69b6b4641fb93bffa81555926887d44a0dfed5edaa4368b8a58a62f689bd58d2"
          assert snapshot["content_sha256"] == "b2b4e8e274cd1a819d3062c237907132b4067c3aac4a33ef2d7230e73f565eec"
          assert snapshot["fighter_frames"] == 89
          assert snapshot["fighter_animations"] == 20
          assert snapshot["stage"] == "mountain_dojo_night"
          assert snapshot["stage_layers"] == 3
          assert snapshot["immutable"] is True
          assert "mountain_dojo_night" in manifest["features"]
          assert "canonical_89_frame_fighter_runtime" in manifest["features"]
          assert "triple_path_ruins" not in manifest["features"]

          telemetry = manifest["telemetry"]
          assert telemetry["schema"] == "tehkne/taijifu-match-telemetry/v3"
          assert telemetry["privacy"] == "local_only"
          assert telemetry["automatic_upload"] is False
          assert telemetry["post_match_balance_feedback"] is True
          assert telemetry["report_copy"] is True

          checksum_parts = checksum_path.read_text(encoding="utf-8").strip().split(maxsplit=1)
          assert len(checksum_parts) == 2, checksum_parts
          expected, referenced_name = checksum_parts
          assert referenced_name.lstrip("*") == zip_path.name, referenced_name
          assert "/" not in referenced_name and "\\" not in referenced_name, referenced_name

          actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          print(json.dumps({
              "build_id": manifest["build_id"],
              "version": manifest["version"],
              "zip_size_bytes": zip_path.stat().st_size,
              "zip_sha256": actual,
              "checksum_reference": referenced_name,
              "telemetry": "local-v3",
              "asset_snapshot": snapshot["tag"],
              "asset_snapshot_commit": snapshot["commit"],
              "asset_snapshot_sha256": snapshot["archive_sha256"],
              "fighter_frames": snapshot["fighter_frames"],
              "stage": snapshot["stage"],
              "stage_layers": snapshot["stage_layers"],
          }, indent=2))
          PY

      - name: Publicar build Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-first-playable-windows-${{ github.sha }}
          path: |
            dist/Taijifu-Masters-First-Playable-Windows-x86_64.zip
            dist/Taijifu-Masters-First-Playable-Windows-x86_64.zip.sha256
            windows-build/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar evidência de snapshot e exportação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-first-playable-windows-log-${{ github.sha }}
          path: |
            first-playable-windows-c30.log
            first-playable-windows-build.log
          if-no-files-found: ignore
          retention-days: 14
