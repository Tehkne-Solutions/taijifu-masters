name: BASE-05 Weapons Foundation

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_05/**'
      - 'assets/modular_fighters/shared_equipment/**'
      - 'config/fighter-presets/preset_lian_wu.json'
      - 'config/modular-fighter-standard-v1.json'
      - 'scripts/characters/modular_fighter_equipment_runtime.gd'
      - 'scripts/characters/modular_fighter_layer_policy.gd'
      - 'scripts/characters/modular_fighter_profile.gd'
      - 'scripts/combat/weapon_kit_catalog.gd'
      - 'scripts/ci/base05_weapons_foundation_smoke.gd'
      - '.github/workflows/base05-weapons-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable BASE-05 foundation across later runtime stages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/modular_fighters/base_05/manifest.json').read_text())
          c=json.loads(Path('assets/modular_fighters/base_05/production/BASE05_WEAPONS_FOUNDATION.json').read_text())
          shared=json.loads(Path('assets/modular_fighters/shared_equipment/manifest.json').read_text())
          preset=json.loads(Path('config/fighter-presets/preset_lian_wu.json').read_text())
          standard=json.loads(Path('config/modular-fighter-standard-v1.json').read_text())
          weapon_source=Path('scripts/combat/weapon_kit_catalog.gd').read_text()

          assert m['pack_id']=='BASE05_WEAPONS'
          assert m['status'] in ('specified_foundation_fail_closed','reference_audit_complete_redraw_required','weapon_main_runtime_validation_pending','production_approved_weapon_main_runtime')
          assert m['slots']==['weapon_main','weapon_offhand']
          assert m['delegated_slots']['weapon_back']=='SHARED_MODULAR_EQUIPMENT'
          assert m['ownership']['combat_logic_owner']=='WeaponKitCatalog_and_BattleLoadoutCatalog'
          assert m['ownership']['visual_assembly_owner']=='ModularFighterEquipmentRuntime'
          assert m['ownership']['duplicate_combat_catalog_forbidden'] is True
          assert m['promotion']['weapon_offhand_runtime_activation'] is False
          assert m['promotion']['creator_exposure'] is False
          runtime_main=bool(m['promotion']['weapon_main_runtime_activation'])
          if runtime_main:
              assert m['promotion']['art_assets_present'] is True
              assert 'katana_lian_wu' in m['modules']
              katana=m['modules']['katana_lian_wu']
              assert katana['slot']=='weapon_main' and katana['combat_reference']=='serene_katana'
              assert katana['runtime_ready'] is True
          else:
              assert m['modules']=={}

          ref=m['required_references']['katana_lian_wu']
          assert ref['slot']=='weapon_main'
          assert ref['standalone_visual_status'] in ('not_materialized','redraw_required','materialized_exact_selected_art')
          assert ref['combat_catalog_reference']=='serene_katana'
          assert ref['visual_to_combat_binding_status'] in ('pending_battle_loadout_verification','verified_via_current_first_playable_fallback')
          assert ref['must_not_extract_without_visual_review'] is True

          # Immutable foundation record remains unchanged even when live manifest advances.
          assert c['status']=='specified_fail_closed'
          assert c['owned_visual_slots']==['weapon_main','weapon_offhand']
          assert c['delegated_visual_slots']['weapon_back']=='SHARED_MODULAR_EQUIPMENT'
          assert c['ownership_contract']['base05_must_not_own_damage_or_technique_resolution'] is True
          assert c['existing_references']['preset_lian_wu_weapon_main']=='katana_lian_wu'
          assert c['existing_references']['shared_weapon_back']=='sheath_lian_wu_blue'
          assert c['existing_references']['existing_combat_kit']=='serene_katana'
          assert c['unresolved_contracts']['katana_lian_wu_standalone_bitmap']=='missing'
          assert c['unresolved_contracts']['visual_to_combat_binding']=='pending_battle_loadout_verification'
          assert c['unresolved_contracts']['creator_control']=='blocked'

          assert 'weapon_main' in standard['slots'] and 'weapon_offhand' in standard['slots'] and 'weapon_back' in standard['slots']
          assert preset['modules']['weapon_main']=='katana_lian_wu'
          assert preset['modules']['weapon_back']=='sheath_lian_wu_blue'
          assert shared['runtime_slots']==['weapon_back']
          assert shared['promotion']['creator_exposure'] is False
          assert '&"serene_katana"' in weapon_source
          print(f"BASE05_STATIC_CONTRACT=PASS lifecycle=true runtime_main={str(runtime_main).lower()} creator=false")
          print('BASE05_OWNERSHIP=PASS combat=existing_catalog visual=shared_runtime')
          print('BASE05_FOUNDATION_LIFECYCLE=PASS status='+m['status'])
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project fail closed
        run: |
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee base05-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|ERR_FILE_CORRUPT' base05-import.log; then exit 1; fi

      - name: Validate BASE-05 foundation in Godot
        run: |
          ./godot --headless --path . --script res://scripts/ci/base05_weapons_foundation_smoke.gd 2>&1 | tee base05-foundation.log
          grep -q 'BASE05_FOUNDATION=PASS pack=BASE05_WEAPONS' base05-foundation.log
          grep -q 'BASE05_OWNERSHIP=PASS combat=WeaponKitCatalog_and_BattleLoadoutCatalog visual=ModularFighterEquipmentRuntime' base05-foundation.log
          grep -q 'BASE05_SLOTS=PASS weapon_back=3 weapon_main=80 weapon_offhand=81 runtime_main=' base05-foundation.log
          grep -q 'runtime_offhand=false' base05-foundation.log
          grep -q 'BASE05_LIAN_REFERENCE=PASS weapon_main=katana_lian_wu weapon_back=sheath_lian_wu_blue combat_kit=serene_katana binding=' base05-foundation.log
          grep -q 'BASE05_CREATOR=BLOCKED expected=true' base05-foundation.log
          grep -q 'BASE05_FOUNDATION_LIFECYCLE=PASS status=' base05-foundation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|BASE05_FOUNDATION=BLOCKED' base05-foundation.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BASE05-WEAPONS-FOUNDATION-EVIDENCE
          path: |
            base05-import.log
            base05-foundation.log
            assets/modular_fighters/base_05/manifest.json
            assets/modular_fighters/base_05/production/BASE05_WEAPONS_FOUNDATION.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'BASE-05 Weapons foundation immutable ownership, lifecycle-aware runtime evolution — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
