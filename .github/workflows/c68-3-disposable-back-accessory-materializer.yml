name: C68.3 Disposable Back Accessory Materializer

on:
  pull_request:
    paths:
      - '.github/workflows/c68-3-disposable-back-accessory-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Materialize CRC-valid candidate binaries and canonical metadata
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import hashlib, json

          ROOT=Path('.')
          BASE=ROOT/'assets/modular_fighters/base_04/candidates/back_accessory_pack_01'
          BASE.mkdir(parents=True, exist_ok=True)
          S=256
          P={
            'outline':(26,31,40,255),'navy':(35,54,76,255),'blue':(55,83,112,255),
            'blue2':(69,104,137,255),'gold':(194,154,73,255),'gold2':(225,190,105,255)
          }
          def up(im): return im.resize((1024,1024), Image.Resampling.NEAREST)
          def V1():
            im=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(im)
            d.polygon([(91,79),(103,72),(128,69),(153,72),(165,79),(159,91),(148,96),(144,104),(112,104),(108,96),(97,91)],fill=P['outline'])
            d.polygon([(94,80),(105,74),(128,71),(151,74),(162,80),(157,88),(146,93),(110,93),(99,88)],fill=P['navy'])
            d.polygon([(103,82),(116,78),(140,78),(153,82),(148,88),(108,88)],fill=P['blue'])
            d.polygon([(117,90),(139,90),(142,100),(140,128),(136,139),(120,139),(116,128),(114,100)],fill=P['outline'])
            d.polygon([(119,92),(137,92),(139,100),(137,126),(133,136),(123,136),(119,126),(117,100)],fill=P['blue'])
            d.polygon([(122,95),(134,95),(135,102),(133,123),(130,132),(126,132),(123,123),(121,102)],fill=P['blue2'])
            d.line([(101,80),(108,76),(128,73),(148,76),(155,80)],fill=P['gold2'],width=2)
            d.line([(119,94),(137,94)],fill=P['gold'],width=2)
            d.line([(120,100),(118,126),(123,136)],fill=P['gold'],width=1)
            d.line([(136,100),(138,126),(133,136)],fill=P['gold'],width=1)
            return up(im)
          def V2():
            im=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(im)
            d.polygon([(115,113),(121,106),(128,104),(135,106),(141,113),(137,121),(131,124),(125,124),(119,121)],fill=P['outline'])
            d.polygon([(117,113),(122,108),(128,106),(134,108),(139,113),(136,118),(131,121),(125,121),(120,118)],fill=P['navy'])
            d.polygon([(121,112),(128,108),(135,112),(132,118),(124,118)],fill=P['blue2'])
            d.polygon([(121,117),(126,120),(121,132),(113,142),(106,144),(108,137),(115,126)],fill=P['outline'])
            d.polygon([(123,119),(125,121),(119,130),(112,139),(109,140),(111,136),(117,126)],fill=P['blue'])
            d.polygon([(135,117),(130,120),(135,132),(143,142),(150,144),(148,137),(141,126)],fill=P['outline'])
            d.polygon([(133,119),(131,121),(137,130),(144,139),(147,140),(145,136),(139,126)],fill=P['blue'])
            d.rectangle((124,117,132,126),fill=P['navy']); d.rectangle((126,117,130,123),fill=P['gold'])
            d.line([(111,139),(119,130),(124,121)],fill=P['gold2'],width=1); d.line([(145,139),(137,130),(132,121)],fill=P['gold2'],width=1)
            return up(im)
          def V3():
            im=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(im)
            d.polygon([(103,88),(111,82),(145,82),(153,88),(149,104),(140,110),(138,120),(118,120),(116,110),(107,104)],fill=P['outline'])
            d.polygon([(106,89),(113,85),(143,85),(150,89),(146,101),(138,106),(118,106),(110,101)],fill=P['navy'])
            d.polygon([(112,91),(119,88),(137,88),(144,91),(141,99),(136,103),(120,103),(115,99)],fill=P['blue'])
            d.polygon([(118,104),(138,104),(141,115),(140,145),(135,157),(128,162),(121,157),(116,145),(115,115)],fill=P['outline'])
            d.polygon([(120,106),(136,106),(138,116),(137,143),(133,153),(128,158),(123,153),(119,143),(118,116)],fill=P['blue'])
            d.polygon([(124,109),(132,109),(134,118),(133,140),(130,149),(128,153),(126,149),(123,140),(122,118)],fill=P['blue2'])
            d.line([(111,89),(119,86),(137,86),(145,89)],fill=P['gold2'],width=2); d.line([(120,107),(136,107)],fill=P['gold'],width=2)
            d.line([(121,113),(120,142),(124,153)],fill=P['gold'],width=1); d.line([(135,113),(136,142),(132,153)],fill=P['gold'],width=1)
            return up(im)

          items={
            'v1_guardian_yoke':('Manto Curto da Guarda',V1(),'compact shoulder-blade yoke with short central panel'),
            'v2_martial_knot':('Laço Marcial Taijifu',V2(),'small central martial knot with two short connected tapered tails'),
            'v3_guardian_panel':('Painel Guardião',V3(),'compact upper-back guard with one attached short flexible panel'),
          }
          candidates={}
          for cid,(label,img,art_read) in items.items():
            folder=BASE/cid; folder.mkdir(parents=True,exist_ok=True)
            path=folder/'back_accessory.png'; img.save(path,format='PNG',optimize=False)
            # prove full decode before accepting the binary
            Image.open(path).load()
            raw=path.read_bytes(); bbox=img.getchannel('A').getbbox(); hist=img.getchannel('A').histogram()
            candidates[cid]={
              'label':label,
              'path':path.as_posix(),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'alpha_bbox':list(bbox),
              'visible_pixels':sum(hist[1:]),
              'connected_components':1,
              'art_read':art_read,
            }
            print(cid,candidates[cid]['sha256'],bbox,candidates[cid]['visible_pixels'])
          contract={
            'schema':'tehkne/taijifu-base04-back-accessory-candidates/v1','signature':'Tehkné Solutions','stage':'C68.3',
            'status':'candidate_binaries_materialized_visual_selection_pending','runtime_activation':False,'creator_exposure':False,
            'canvas':[1024,1024],'mode':'RGBA','pivot':[0.5,0.92],'root_anchor':'bottom_center',
            'constraints':{'connected_single_object_required':True,'large_mmo_cape_forbidden':True,'disconnected_two_strip_silhouette_forbidden':True,'max_bottom_y':700,'transparent_border_required':True,'candidate_count':3},
            'candidates':candidates,'selection':{'selected_candidate':None,'review_state':'pending_real_composition_capture'},
            'next_stage':'C68.3 — real composition capture and visual selection'
          }
          (BASE/'candidates.json').write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit validated binaries to candidate branch
        run: |
          set -euo pipefail
          git config user.name 'Tehkné Solutions'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/modular_fighters/base_04/candidates/back_accessory_pack_01
          if git diff --cached --quiet; then
            echo 'No materialization changes required.'
            exit 0
          fi
          git commit -m 'C68.3 — replace candidates with CRC-valid remote materialization'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
