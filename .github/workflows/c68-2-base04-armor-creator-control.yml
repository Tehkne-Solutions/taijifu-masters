name: C68.2 BASE-04 Armor Creator Control

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_04/**'
      - 'scripts/characters/modular_fighter_armor_runtime.gd'
      - 'scripts/characters/modular_fighter_creator_scene.gd'
      - 'scripts/ci/base04_armor_creator_control_smoke.gd'
      - 'scripts/ci/base04_armor_creator_visual_review.gd'
      - '.github/workflows/c68-2-base04-armor-creator-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armor-creator-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable C68.2 Armor contract across later Back Accessory exposure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/modular_fighters/base_04/manifest.json').read_text())
          c=json.loads(Path('assets/modular_fighters/base_04/production/BASE04_ARMOR_CREATOR_CONTROL.json').read_text())
          assert m['pack_id']=='BASE04_ARMOR_ACCESSORIES'
          assert m['promotion']['creator_exposure'] is True
          assert m['public_controls']['armor_set']['creator_exposed'] is True
          assert m['public_controls']['armor_set']['direct_slot_controls'] is False
          assert m['public_controls']['armor_set']['atomic_slots']==['head_accessory','shoulders']
          assert m['armor_sets']['armor_none']['production_ready'] is True
          assert m['armor_sets']['armor_01_taijifu_guard']['production_ready'] is True
          assert c['stage']=='C68.2'
          assert c['public_control']['node_name']=='ArmorSetOption'
          assert c['public_control']['selection_unit']=='armor_set'
          assert c['public_control']['direct_slot_controls'] is False
          assert c['public_control']['cross_set_piece_mixing'] is False
          assert [x['id'] for x in c['production_options']]==['armor_none','armor_01_taijifu_guard']
          assert c['back_accessory']['creator_control_exposed'] is False
          assert c['back_accessory']['forced_compatible_default']=='back_none'
          # C68.2's historical contract remains immutable. Later reviewed stages may
          # independently expose BackAccessoryOption, but raw armor/weapon slots never appear.
          back_creator=bool(m['promotion'].get('back_accessory_creator_exposure',False))
          if back_creator:
              assert m['public_controls']['back_accessory']['creator_exposed'] is True
              assert any(k!='back_none' and v.get('production_ready') is True for k,v in m['back_accessories'].items())
          else:
              assert m['public_controls']['back_accessory']['creator_exposed'] is False
          print(f"C68_2_STATIC_CONTRACT=PASS options=2 atomic=true lifecycle_back_control={str(back_creator).lower()}")
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3 and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project fail closed
        run: |
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c68-2-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|ERR_FILE_CORRUPT' c68-2-import.log; then exit 1; fi

      - name: Preserve C67.2 Uniform Creator control
        run: |
          ./godot --headless --path . --script res://scripts/ci/base03_uniform_creator_control_smoke.gd 2>&1 | tee c68-2-c67-2.log
          grep -q 'C67_2_UNIFORM_CREATOR_CONTROL=PASS' c68-2-c67-2.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C67_2_CREATOR=BLOCKED' c68-2-c67-2.log; then exit 1; fi

      - name: Validate C68.2 Armor Creator regression end to end
        run: |
          ./godot --headless --path . --script res://scripts/ci/base04_armor_creator_control_smoke.gd 2>&1 | tee c68-2-runtime.log
          grep -q 'C68_2_ARMOR_CONTROL=PASS options=2 unit=armor_set' c68-2-runtime.log
          grep -q 'C68_2_DIRECT_SLOT_CONTROLS=ABSENT armor_slots=2 raw_piece_controls=false' c68-2-runtime.log
          grep -q 'C68_2_LIVE_PREVIEW=PASS head_z=60 shoulders_z=70 hair_preserved=true uniform_preserved=true' c68-2-runtime.log
          grep -q 'C68_2_PRESET_ROUNDTRIP=PASS schema=v2 atomic_set=true back=back_none' c68-2-runtime.log
          grep -q 'C68_2_BATTLE_HANDOFF=PASS armor=armor_01_taijifu_guard back=back_none hair=hair_01_lian_topknot uniform=uniform_01_lian_martial' c68-2-runtime.log
          grep -q 'C68_2_ARMOR_CREATOR_CONTROL=PASS lifecycle_aware=true' c68-2-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C68_2_CREATOR=BLOCKED' c68-2-runtime.log; then exit 1; fi

      - name: Capture lifecycle-aware C68.2 visual evidence
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://scripts/ci/base04_armor_creator_visual_review.gd 2>&1 | tee c68-2-visual.log
          grep -q 'C68_2_CREATOR_VISUAL=PASS armor=armor_01_taijifu_guard hair=hair_01_lian_topknot uniform=uniform_01_lian_martial' c68-2-visual.log
          grep -q 'C68_2_CREATOR_LAYOUT=PASS armor_atomic=true raw_armor_controls=false' c68-2-visual.log
          test -s artifacts/c68_2/C68_2_ARMOR_CREATOR_CONTROL.review-1280x720.png
          if grep -Eq 'SCRIPT ERROR|Parse Error|C68_2_VISUAL=BLOCKED' c68-2-visual.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C68-2-BASE04-ARMOR-CREATOR-CONTROL-EVIDENCE
          path: |
            c68-2-import.log
            c68-2-c67-2.log
            c68-2-runtime.log
            c68-2-visual.log
            artifacts/c68_2/C68_2_ARMOR_CREATOR_CONTROL.review-1280x720.png
            assets/modular_fighters/base_04/manifest.json
            assets/modular_fighters/base_04/production/BASE04_ARMOR_CREATOR_CONTROL.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'C68.2 immutable Armor Creator contract, lifecycle-aware after C68.5 — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
