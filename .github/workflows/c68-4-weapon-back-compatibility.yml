name: C68.4 Weapon Back Compatibility

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/shared_equipment/**'
      - 'assets/modular_fighters/base_04/candidates/back_accessory_pack_01/**'
      - 'scripts/characters/modular_fighter_equipment_runtime.gd'
      - 'scripts/ci/c68_4_equipment_runtime_smoke.gd'
      - 'scripts/ci/c68_4_weapon_back_compatibility_review.py'
      - '.github/workflows/c68-4-weapon-back-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weapon-back-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate fail-closed equipment contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('assets/modular_fighters/shared_equipment/manifest.json').read_text())
          assert m['signature']=='Tehkné Solutions'
          assert m['pack_id']=='SHARED_MODULAR_EQUIPMENT'
          assert m['ownership']['combat_logic_owner']=='WeaponKitCatalog_and_BattleLoadoutCatalog'
          assert m['ownership']['visual_profile_owner']=='ModularFighterProfile.modules'
          assert m['ownership']['assembly_owner']=='ModularFighterEquipmentRuntime'
          assert m['ownership']['creator_exposure'] is False
          assert m['promotion']['runtime_activation'] is False
          assert m['promotion']['presenter_integration'] is False
          assert m['promotion']['creator_exposure'] is False
          assert list(m['modules'])==['sheath_lian_wu_blue']
          s=m['modules']['sheath_lian_wu_blue']
          assert s['slot']=='weapon_back'
          assert s['layer']==3
          assert s['canvas']==[1024,1024]
          assert s['mode']=='RGBA'
          assert s['pivot']==[0.5,0.92]
          assert s['runtime_ready'] is False
          assert s['production_ready'] is False
          path=Path(s['path'])
          assert path.is_file()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==s['sha256']
          assert not Path('.github/workflows/c68-4-disposable-sheath-materializer.yml').exists()
          print('C68_4_EQUIPMENT_CONTRACT=PASS module=sheath_lian_wu_blue slot=weapon_back z=3')
          print('C68_4_FAIL_CLOSED=PASS runtime=false presenter=false creator=false writer=absent')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Pillow and validate canonical composition
        run: |
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 scripts/ci/c68_4_weapon_back_compatibility_review.py | tee c68-4-compatibility.log
          grep -q 'C68_4_LAYER_ORDER=PASS weapon_back=3 back_accessory=4 hair_back=5' c68-4-compatibility.log
          grep -q 'C68_4_COMPATIBILITY=PASS authored=true flipped=true gameplay_scale=true' c68-4-compatibility.log
          grep -q 'C68_4_PROMOTION_STATE=PASS equipment_runtime=false back_runtime=false creator=false' c68-4-compatibility.log

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c68-4-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|ERR_FILE_CORRUPT' c68-4-import.log; then exit 1; fi

      - name: Validate candidate equipment runtime ownership and z chain
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/c68_4_equipment_runtime_smoke.gd 2>&1 | tee c68-4-runtime.log
          grep -q 'C68_4_EQUIPMENT_RUNTIME=PASS module=sheath_lian_wu_blue candidate_mode=true production=false' c68-4-runtime.log
          grep -q 'C68_4_Z_CHAIN=PASS weapon_back=3 back_accessory=4 hair_back=5' c68-4-runtime.log
          grep -q 'C68_4_OWNERSHIP=PASS visual=SHARED_MODULAR_EQUIPMENT combat=WeaponKitCatalog_and_BattleLoadoutCatalog' c68-4-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C68_4_.*BLOCKED' c68-4-runtime.log; then exit 1; fi

      - name: Upload C68.4 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c68-4-weapon-back-compatibility
          path: |
            c68-4-compatibility.log
            c68-4-import.log
            c68-4-runtime.log
            artifacts/c68_4/C68_4_WEAPON_BACK_BACK_ACCESSORY.review-1920x1080.png
            assets/modular_fighters/shared_equipment/manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'C68.4 standalone sheath + selected Back Accessory compatibility, read-only and fail-closed — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
