name: First Playable Snapshot-Pinned Intake

on:
  pull_request:
    paths:
      - 'config/v2-arena-intake-contract.json'
      - 'tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1'
      - '.github/workflows/pack03-release-pinned-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c30-release-pin:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run C30 against isolated composed Asset Vault snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-first-playable-pinned'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath first-playable-c30-pinned.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify composed snapshot intake evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VM02_C30_SOURCE_PIN_CONTRACT=PASS ref=assets-first-playable-v1.0.0 commit=b6767d9d30fb2980de5d0a57a8a4c414b854cad5' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SOURCE_PIN=PASS' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SNAPSHOT_FREEZE=PASS' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SNAPSHOT_LIAN=PASS frames=45 animations=10' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SNAPSHOT_RIVAL=PASS frames=44 animations=10' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SNAPSHOT_STAGE=PASS layers=3' first-playable-c30-pinned.log
          grep -q 'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS' first-playable-c30-pinned.log
          grep -q 'VM02_C30_ARENA_FILE_COUNT=6/6' first-playable-c30-pinned.log
          grep -q 'VM02_C30_SOURCE_MANIFEST_SCHEMA=PASS' first-playable-c30-pinned.log
          grep -q 'VM02_C30_ARENA_IMPORT=PASS' first-playable-c30-pinned.log
          grep -q 'VM02_C30_ARENA_CANONICAL_READY=PASS' first-playable-c30-pinned.log
          grep -q 'VM02_C30_V2_ARENA_INTAKE_GATE=PASS' first-playable-c30-pinned.log
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('assets/pack_03_stages/mountain_dojo_night')
          expected={
              'background.png':'dea8326025e65dcfd12bfa7073f0c666b37f267580b946649a6e6010b71269d9',
              'midground.png':'000b550881f334ac6cf60d8f567ca051c85ccb61f4fd1e788bf3fcccef6ba907',
              'foreground.png':'d7741b66dc15a16ad5c58d5f6b3fb9344b502f05bdac97d871dbde495de9430d',
          }
          for name,digest in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'FIRST_PLAYABLE_PINNED_STAGE_LAYER=BLOCKED file={name} actual={actual}')
              print(f'FIRST_PLAYABLE_PINNED_STAGE_LAYER=PASS file={name} sha256={actual}')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8-sig'))
          if manifest.get('status')!='art_final' or manifest.get('version')!='1.0.0' or manifest.get('promotion',{}).get('canonical_ready') is not True:
              raise SystemExit('FIRST_PLAYABLE_PINNED_STAGE_MANIFEST=BLOCKED')
          print('FIRST_PLAYABLE_PINNED_STAGE_MANIFEST=PASS version=1.0.0 status=art_final')
          print('FIRST_PLAYABLE_SNAPSHOT_PINNED_INTAKE=PASS fighters=89 stage_layers=3')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FIRST-PLAYABLE-SNAPSHOT-PINNED-INTAKE
          path: first-playable-c30-pinned.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'First Playable composed snapshot-pinned C30 intake — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
