name: Taijifu Asset Forge Intake

on:
  pull_request:
    paths:
      - 'tools/asset_forge/intake.py'
      - 'asset-forge/intake/**'
      - 'tests/asset_forge/test_intake.py'
      - '.github/workflows/taijifu-asset-forge-intake.yml'
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar testes
        run: python -m pip install -r requirements-tgap-test.txt
      - name: Testar intake seguro
        run: python -m pytest -q tests/asset_forge/test_intake.py
      - name: Confirmar ausência de intake visual fabricado
        run: |
          test ! -e asset-forge/intake/pack_01_lian_wu_base/char_lian_wu__master_raw.png
          test ! -e asset-forge/intake/pack_01_lian_wu_base/turnaround_raw.png
          test ! -e asset-forge/intake/pack_01_lian_wu_base/portraits_raw.png
          test ! -e asset-forge/intake/pack_01_lian_wu_base/icons_raw.png
