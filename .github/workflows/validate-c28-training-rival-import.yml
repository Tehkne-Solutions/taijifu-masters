name: C28 Training Rival 44 Import

on:
  pull_request:
    paths:
      - 'config/v2-rival-intake-contract.json'
      - 'config/c28-training-rival-runtime-evidence.json'
      - 'assets/tgap/training_rival/first_playable_lot_01/**'
      - 'scripts/vertical_slice/training_rival_lot01_presenter.gd'
      - 'tools/import_training_rival_c28_from_assets.py'
      - 'tools/validate_training_rival_c28_import.py'
      - 'tools/RUN-VM02-C28-V2-RIVAL-INTAKE-GATE.ps1'
      - 'tests/training_rival_c28_runtime_bench.gd'
      - '.github/workflows/validate-c28-training-rival-import.yml'
      - '.github/workflows/godot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c28-import:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse C28 importer and validator
        run: |
          python -m py_compile tools/import_training_rival_c28_from_assets.py
          python -m py_compile tools/validate_training_rival_c28_import.py
          echo 'VM02_C28_PYTHON_PARSE=PASS'
      - name: Validate imported Training Rival 44/44 and frozen runtime evidence
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_training_rival_c28_import.py 2>&1 | tee c28-training-rival-import.log
          grep -q 'VM02_C28_IMPORTED_PACK=PASS frames=44/44' c28-training-rival-import.log
          grep -q 'VM02_C28_IMPORTED_HASHES=PASS frames=44' c28-training-rival-import.log
          grep -q 'VM02_C28_PRESENTER_PATH=PASS' c28-training-rival-import.log
          grep -q 'VM02_C28_SPRITEFRAMES_STATIC=PASS animations=10 frames=44' c28-training-rival-import.log
          grep -q 'VM02_C28_RUNTIME_EVIDENCE=PASS frozen=true' c28-training-rival-import.log
          grep -q 'VM02_C28_DISPOSABLE_WRITER=ABSENT' c28-training-rival-import.log
          grep -q 'VM02_C28_RUNTIME_READY=PASS presenter_using_real_assets=true fallback_preserved=true' c28-training-rival-import.log
          grep -q 'SIGNATURE=Tehkné Solutions' c28-training-rival-import.log
      - name: Validate historical PowerShell C28 entrypoint end-to-end
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/RUN-VM02-C28-V2-RIVAL-INTAKE-GATE.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'VM02_C28_POWERSHELL_PARSE=PASS'
          $output = @(& pwsh -NoProfile -File tools/RUN-VM02-C28-V2-RIVAL-INTAKE-GATE.ps1 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "VM02_C28_POWERSHELL_GATE=BLOCKED exit=$exitCode" }
          $text = $output -join "`n"
          foreach ($marker in @(
            'VM02_C28_REPO_ROOT=PASS',
            'VM02_C28_VALIDATOR=PASS',
            'VM02_C28_FRAME_COUNT=44/44',
            'VM02_C28_RIVAL_CANONICAL_READY=PASS',
            'VM02_C28_REAL_ASSETS_ACTIVE=PASS',
            'VM02_C28_PROCEDURAL_FALLBACK=PRESERVED',
            'VM02_C28_V2_RIVAL_INTAKE_GATE=PASS'
          )) {
            if (-not $text.Contains($marker)) { throw "VM02_C28_POWERSHELL_GATE=BLOCKED missing_marker=$marker" }
          }
          Write-Host 'VM02_C28_POWERSHELL_GATE=PASS runtime_active=true frames=44/44'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C28-TRAINING-RIVAL-44-IMPORT
          path: |
            c28-training-rival-import.log
            config/c28-training-rival-runtime-evidence.json
            assets/tgap/training_rival/first_playable_lot_01/c28-import-manifest.json
            assets/tgap/training_rival/first_playable_lot_01/training_rival_first_playable_frames.tres
          if-no-files-found: ignore
          retention-days: 30
      - name: Summary
        run: echo 'C28 Training Rival 44/44 import + runtime evidence + PowerShell compatibility — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
