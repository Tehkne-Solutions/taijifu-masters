name: C28 Training Rival 44 Import

on:
  pull_request:
    paths:
      - 'config/v2-rival-intake-contract.json'
      - 'assets/tgap/training_rival/first_playable_lot_01/**'
      - 'scripts/vertical_slice/training_rival_lot01_presenter.gd'
      - 'tools/import_training_rival_c28_from_assets.py'
      - 'tools/validate_training_rival_c28_import.py'
      - 'tests/training_rival_c28_runtime_bench.gd'
      - '.github/workflows/validate-c28-training-rival-import.yml'
      - '.github/workflows/godot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c28-import:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse C28 importer and validator
        run: |
          python -m py_compile tools/import_training_rival_c28_from_assets.py
          python -m py_compile tools/validate_training_rival_c28_import.py
          echo 'VM02_C28_PYTHON_PARSE=PASS'
      - name: Validate imported Training Rival 44/44
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_training_rival_c28_import.py 2>&1 | tee c28-training-rival-import.log
          grep -q 'VM02_C28_IMPORTED_PACK=PASS frames=44/44' c28-training-rival-import.log
          grep -q 'VM02_C28_IMPORTED_HASHES=PASS frames=44' c28-training-rival-import.log
          grep -q 'VM02_C28_PRESENTER_PATH=PASS' c28-training-rival-import.log
          grep -q 'VM02_C28_SPRITEFRAMES_STATIC=PASS animations=10 frames=44' c28-training-rival-import.log
          grep -q 'VM02_C28_DISPOSABLE_WRITER=ABSENT' c28-training-rival-import.log
          grep -q 'VM02_C28_PROXY_RETIREMENT=BLOCKED godot_runtime_bench_required=true' c28-training-rival-import.log
          grep -q 'SIGNATURE=Tehkné Solutions' c28-training-rival-import.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C28-TRAINING-RIVAL-44-IMPORT
          path: |
            c28-training-rival-import.log
            assets/tgap/training_rival/first_playable_lot_01/c28-import-manifest.json
            assets/tgap/training_rival/first_playable_lot_01/training_rival_first_playable_frames.tres
          if-no-files-found: ignore
          retention-days: 30
      - name: Summary
        run: echo 'C28 Training Rival 44/44 import gate — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
