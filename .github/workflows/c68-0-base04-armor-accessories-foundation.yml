name: C68.0 BASE-04 Armor Accessories Foundation

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_04/**'
      - 'scripts/characters/modular_fighter_armor_runtime.gd'
      - 'scripts/ci/base04_armor_accessories_foundation_smoke.gd'
      - 'scripts/characters/modular_fighter_layer_policy.gd'
      - 'config/modular-fighter-standard-v1.json'
      - '.github/workflows/c68-0-base04-armor-accessories-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base04-foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable BASE-04 architecture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/modular_fighters/base_04/manifest.json').read_text())
          c=json.loads(Path('assets/modular_fighters/base_04/production/BASE04_ARMOR_ACCESSORIES_FOUNDATION.json').read_text())
          s=json.loads(Path('config/modular-fighter-standard-v1.json').read_text())
          assert m['signature']=='Tehkné Solutions'
          assert m['pack_id']=='BASE04_ARMOR_ACCESSORIES'
          foundation=m['status']=='foundation_no_art_assets'
          evolved=m['status'].startswith('production_candidate_') or m['status'].startswith('production_approved_')
          assert foundation or evolved
          assert m['slots']==['head_accessory','shoulders','back_accessory']
          armor=m['public_controls']['armor_set']; back=m['public_controls']['back_accessory']
          assert armor['atomic_slots']==['head_accessory','shoulders']
          assert armor['direct_slot_controls'] is False
          assert armor['selection_atomic'] is True
          assert armor['default_id']=='armor_none'
          assert back['slot']=='back_accessory' and back['default_id']=='back_none'
          assert m['armor_sets']['armor_none']['head_accessory'] is None
          assert m['armor_sets']['armor_none']['shoulders'] is None
          assert m['back_accessories']['back_none']['back_accessory'] is None
          if foundation:
              assert m['modules']=={}
              assert not list(Path('assets/modular_fighters/base_04').rglob('*.png'))
              assert m['promotion']['art_assets_present'] is False
          else:
              assert m['modules'] and m['promotion']['art_assets_present'] is True
              for mid,mod in m['modules'].items():
                  assert mod['slot'] in ('head_accessory','shoulders','back_accessory'), mid
                  assert (Path('.')/mod['path']).is_file(), mod['path']
          assert m['promotion']['creator_exposure'] is False
          assert c['component_id']=='BASE04_ARMOR_ACCESSORIES_FOUNDATION'
          assert c['stage']=='C68.0'
          assert c['selection_contract']['armor_set']['atomic_slots']==['head_accessory','shoulders']
          assert c['selection_contract']['armor_set']['direct_piece_controls'] is False
          assert c['selection_contract']['armor_set']['cross_set_piece_mixing'] is False
          assert c['selection_contract']['back_accessory']['atomic_slots']==['back_accessory']
          assert c['profile_contract']['schema_change_required'] is False
          assert c['compatibility_contract']['reference_hair']=='hair_01_lian_topknot'
          assert c['compatibility_contract']['reference_uniform']=='uniform_01_lian_martial'
          for slot in ('head_accessory','shoulders','back_accessory'):
              assert slot in s['slots']
          assert 'shoulders' not in s['creator_v1_editable_slots']
          print(f"C68_0_STATIC_CONTRACT=PASS stage={'foundation' if foundation else 'evolved'} armor_atomic=true back_independent=true creator=false")
          print('SIGNATURE=Tehkné Solutions')
          PY
      - name: Summary
        run: echo 'C68.0 immutable BASE-04 architecture gate — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
