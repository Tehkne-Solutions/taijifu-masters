name: C68.4 Disposable Sheath Materializer

on:
  pull_request:
    paths:
      - '.github/workflows/c68-4-disposable-sheath-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Materialize standalone sheath and bind exact metadata
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import hashlib, json

          root=Path('.')
          manifest_path=root/'assets/modular_fighters/shared_equipment/manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['pack_id']=='SHARED_MODULAR_EQUIPMENT'
          assert manifest['promotion']['runtime_activation'] is False

          # 256x authored pixel contract, then nearest-neighbor to canonical 1024.
          im=Image.new('RGBA',(256,256),(0,0,0,0)); d=ImageDraw.Draw(im)
          outline=(24,29,38,255)
          navy=(27,48,76,255)
          blue=(34,87,143,255)
          blue_hi=(58,123,184,255)
          gold=(190,147,68,255)
          gold_hi=(229,191,102,255)

          # Lian Wu's blue sheath: compact diagonal weapon_back at left hip.
          # The central throat is intentionally behind the torso at z3 while the
          # blue scabbard/tip protrude to viewer-left, preserving gameplay read.
          d.polygon([(106,113),(117,120),(68,188),(55,181)],fill=outline)
          d.polygon([(108,117),(114,121),(66,184),(59,180)],fill=navy)
          d.polygon([(106,121),(111,124),(65,181),(61,178)],fill=blue)
          d.line([(105,122),(65,176)],fill=blue_hi,width=2)

          # Gold throat/fittings and compact suspension loop.
          d.polygon([(103,111),(119,120),(115,127),(99,118)],fill=outline)
          d.polygon([(105,113),(117,120),(113,124),(101,117)],fill=gold)
          d.line([(106,114),(115,120)],fill=gold_hi,width=1)
          d.polygon([(96,112),(105,115),(102,124),(94,121)],fill=outline)
          d.polygon([(98,114),(103,116),(100,121),(96,119)],fill=gold)

          # Reinforced blue end-cap with restrained gold edge.
          d.polygon([(54,179),(69,187),(65,194),(50,186)],fill=outline)
          d.polygon([(57,181),(66,187),(63,191),(53,185)],fill=blue)
          d.line([(53,185),(63,191)],fill=gold_hi,width=2)

          # Small connected suspension tab keeps this a complete equipment object.
          d.polygon([(101,114),(92,109),(87,112),(96,119)],fill=outline)
          d.polygon([(99,115),(92,112),(90,113),(96,117)],fill=navy)
          d.line([(93,112),(98,115)],fill=gold,width=1)

          image=im.resize((1024,1024),Image.Resampling.NEAREST)
          folder=root/'assets/modular_fighters/shared_equipment/weapon_back/sheath_lian_wu_blue'
          folder.mkdir(parents=True,exist_ok=True)
          path=folder/'sheath_lian_wu_blue.png'
          image.save(path,format='PNG',optimize=False)
          Image.open(path).load()

          raw=path.read_bytes()
          bbox=image.getchannel('A').getbbox()
          hist=image.getchannel('A').histogram()
          visible=sum(hist[1:])
          module={
            'slot':'weapon_back',
            'path':path.as_posix(),
            'sha256':hashlib.sha256(raw).hexdigest(),
            'canvas':[1024,1024],
            'mode':'RGBA',
            'alpha_bbox':list(bbox),
            'visible_pixels':visible,
            'pivot':[0.5,0.92],
            'root_anchor':'bottom_center',
            'layer':3,
            'runtime_ready':False,
            'production_ready':False,
            'source':{
              'method':'c68_4_controlled_standalone_redraw',
              'historical_character_lock_modified':False,
              'historical_exact_sheath_bitmap_available':False,
              'identity_reference':'Lian Wu blue/gold martial equipment',
              'placement':'left_hip_diagonal_weapon_back'
            }
          }
          manifest['status']='c68_4_sheath_candidate_materialized_compatibility_pending'
          manifest['modules']={'sheath_lian_wu_blue':module}
          manifest['required_reference_modules']['sheath_lian_wu_blue']['status']='candidate_materialized'
          manifest['promotion']['blocker']='c68_4_z3_z4_z5_compatibility_required'
          manifest['next_stage']='C68.4 — validate sheath_lian_wu_blue z3 with selected Painel Guardião z4 and hair_back z5'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('C68_4_SHEATH_SHA='+module['sha256'])
          print('C68_4_SHEATH_BBOX='+str(module['alpha_bbox']))
          print('C68_4_SHEATH_VISIBLE='+str(visible))
          print('C68_4_SHEATH_DECODE=PASS')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Refuse push unless canonical compatibility gate passes
        run: python3 scripts/ci/c68_4_weapon_back_compatibility_review.py

      - name: Commit gate-passing candidate only
        run: |
          set -euo pipefail
          git config user.name 'Tehkné Solutions'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/modular_fighters/shared_equipment
          git diff --cached --quiet && exit 0
          git commit -m 'C68.4 — materialize standalone Lian Wu sheath candidate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
