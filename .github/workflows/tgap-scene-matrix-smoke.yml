name: TGAP Scene Matrix Smoke

on:
  pull_request:
    paths:
      - "scripts/runtime/**"
      - "scenes/**"
      - "assets/tgap/**"
      - "tests/tgap/**"
      - "project.godot"
      - ".github/workflows/tgap-scene-matrix-smoke.yml"
  workflow_dispatch:

jobs:
  scene-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/tgap/test_scene_matrix_smoke_contract.py tests/tgap/test_runtime_smoke_contract.py tests/tgap/test_legacy_autoload_removed.py
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - run: godot --headless --editor --path . --quit-after 2
      - run: godot --headless --path . --script tests/tgap/runtime_scene_matrix_smoke.gd
      - run: python scripts/tgap_audit_legacy_usage.py --fail-on-findings
