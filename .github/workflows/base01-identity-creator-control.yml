name: BASE-01 Identity Creator Control

on:
  pull_request:
    paths:
      - 'scripts/characters/modular_fighter_profile.gd'
      - 'scripts/characters/modular_fighter_assembler.gd'
      - 'scripts/characters/modular_fighter_skin_selector.gd'
      - 'scripts/characters/modular_fighter_identity_selector.gd'
      - 'scripts/ci/base01_identity_creator_control_smoke.gd'
      - 'scripts/runtime/base01_identity_creator_control_bench.gd'
      - 'assets/modular_fighters/base_01/manifest.json'
      - 'assets/modular_fighters/base_01/production/BASE01_IDENTITY_CREATOR_CONTROL.json'
      - 'assets/modular_fighters/base_01/production_plan.json'
      - '.github/workflows/base01-identity-creator-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-creator-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - name: Validate identity creator contracts
        run: |
          set -euo pipefail
          python scripts/ci/validate_base01_skin_contract.py
          python - <<'PY'
          import json
          from pathlib import Path

          control=json.loads(Path('assets/modular_fighters/base_01/production/BASE01_IDENTITY_CREATOR_CONTROL.json').read_text())
          plan=json.loads(Path('assets/modular_fighters/base_01/production_plan.json').read_text())
          manifest=json.loads(Path('assets/modular_fighters/base_01/manifest.json').read_text())

          assert control['signature']=='Tehkné Solutions'
          assert control['status']=='implementation_candidate_owner_review_pending'
          assert control['runtime_contract']['total_options']==24
          assert control['runtime_contract']['keyboard_focus'] is True
          assert control['runtime_contract']['gamepad_focus'] is True
          assert control['runtime_contract']['invalid_selection_policy']=='fail_closed_with_no_mutation'
          assert control['face_plate_policy']['module_id']=='neutral_face_plate_v1'
          assert control['face_plate_policy']['creator_editable'] is False
          assert control['face_plate_policy']['default_face_plate']=='absent'
          assert control['face_plate_policy']['non_default_face_plate']=='required_automatic'
          assert control['face_plate_policy']['z_order']==['face_plate','face','eyes','brows']
          assert control['categories']['skin']['options']==8
          assert control['categories']['face']['options']==4
          assert control['categories']['eyes']['options']==6
          assert control['categories']['brows']['options']==6
          assert manifest['default_identity']['face']=='face_01_balanced'
          assert manifest['modules']['neutral_face_plate_v1']['slot']=='face_plate'

          packs={p['pack_id']:p for p in plan['packs']}
          pack=packs['BASE01-IDENTITY-CREATOR-CONTROL']
          assert pack['status']=='implementation_candidate_owner_review_pending'
          assert pack['scope']==['skin','face','eyes','brows']
          assert 'automatic_face_plate_policy' in pack['required_outputs_per_module']
          print('C62_4_IDENTITY_CONTRACT=PASS total_options=24')
          PY

      - name: Install Godot 4.3 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import identity creator resources fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c62-4-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-4-import.log; then
            echo 'C62_4_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run identity creator runtime smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base01_identity_creator_control_smoke.gd 2>&1 | tee c62-4-runtime.log
          grep -q 'C62_4_IDENTITY_CREATOR_CONTROL=PASS skin=8 face=4 eyes=6 brows=6' c62-4-runtime.log
          grep -q 'C62_4_FACE_PLATE_POLICY=PASS default=none variants=plate' c62-4-runtime.log
          grep -q 'C62_4_PROFILE_ASSEMBLER_SYNC=PASS' c62-4-runtime.log
          grep -q 'C62_4_INVALID_SELECTIONS=BLOCKED' c62-4-runtime.log
          grep -q 'C62_4_KEYBOARD_GAMEPAD_FOCUS=PASS' c62-4-runtime.log
          grep -q 'C62_4_SERIALIZATION=PASS' c62-4-runtime.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-4-runtime.log; then
            echo 'C62_4_RUNTIME_ERRORS=BLOCKED'
            exit 1
          fi

      - name: Render identity creator review
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --rendering-method gl_compatibility --resolution 1280x720 --script res://scripts/runtime/base01_identity_creator_control_bench.gd 2>&1 | tee c62-4-visual.log
          grep -q 'C62_4_IDENTITY_VISUAL=PASS transitions=24 skin=8 face=4 eyes=6 brows=6' c62-4-visual.log
          grep -q 'C62_4_FACE_PLATE_VISUAL_POLICY=PASS internal=true creator_editable=false' c62-4-visual.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' c62-4-visual.log; then
            echo 'C62_4_VISUAL_ERRORS=BLOCKED'
            exit 1
          fi

      - name: Assert identity review artifact
        run: |
          set -euo pipefail
          test -s artifacts/c62-4/BASE01_IDENTITY_CREATOR_CONTROL.review-1920x1080.png
          test -s artifacts/c62-4/BASE01_IDENTITY_CREATOR_CONTROL.qa.json
          python - <<'PY'
          import json, struct
          from pathlib import Path
          png=Path('artifacts/c62-4/BASE01_IDENTITY_CREATOR_CONTROL.review-1920x1080.png').read_bytes()
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', png[16:24])==(1920,1080)
          qa=json.loads(Path('artifacts/c62-4/BASE01_IDENTITY_CREATOR_CONTROL.qa.json').read_text())
          assert qa['status']=='implementation_candidate_owner_review_pending'
          assert qa['option_counts']=={'skin':8,'face':4,'eyes':6,'brows':6}
          assert qa['runtime_transitions_exercised']==24
          assert qa['selected']=={
            'skin':'skin_tone_07_deep',
            'face':'face_04_broad',
            'eyes':'eyes_03_fierce',
            'brows':'brows_06_sharp'
          }
          assert qa['profile_runtime_sync']=='PASS'
          assert qa['face_plate_policy']=='PASS'
          assert qa['face_plate_creator_editable'] is False
          assert qa['z_order']=='PASS'
          assert qa['skin_material_propagation']=='PASS'
          assert qa['keyboard_gamepad_focus']=='PASS'
          assert qa['owner_review']=='PENDING'
          print('C62_4_IDENTITY_REVIEW_ARTIFACT=PASS size=1920x1080')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BASE01-IDENTITY-CREATOR-CONTROL-REVIEW
          path: |
            artifacts/c62-4/BASE01_IDENTITY_CREATOR_CONTROL.review-1920x1080.png
            artifacts/c62-4/BASE01_IDENTITY_CREATOR_CONTROL.qa.json
            c62-4-import.log
            c62-4-runtime.log
            c62-4-visual.log
          if-no-files-found: ignore

      - name: Summary
        run: echo 'C62.4 BASE-01 Identity Creator Control PASS — owner review pending — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
