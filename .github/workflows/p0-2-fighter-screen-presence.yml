name: P0.2 Fighter Screen Presence

on:
  pull_request:
    paths:
      - 'scripts/vertical_slice/first_playable.gd'
      - 'scripts/vertical_slice/first_playable_camera_composition.gd'
      - 'scripts/vertical_slice/first_playable_modular_pose_runtime.gd'
      - 'scripts/characters/modular_fighter_motion_library.gd'
      - 'scripts/characters/modular_fighter_pose_rig.gd'
      - 'config/p0_2_modular_fighter_motion_library_v1.json'
      - 'scripts/ci/p0_2_fighter_screen_presence_review.gd'
      - 'tools/RUN-VM02-C46-V2-COMBAT-READABILITY-BALANCE-GATE.ps1'
      - '.github/workflows/p0-2-fighter-screen-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fighter-screen-presence:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Materialize canonical First Playable snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-p02-screen-presence'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath p0-2-screen-presence-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require canonical snapshot authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VM02_C30_SOURCE_PIN=PASS' p0-2-screen-presence-c30.log
          grep -q 'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89' p0-2-screen-presence-c30.log
          grep -q 'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS' p0-2-screen-presence-c30.log
          echo 'P0_2_SCREEN_PRESENCE_CANONICAL_SNAPSHOT=PASS'

      - name: Require camera framing contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const MIN_ZOOM := 0.72' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const MAX_ZOOM := 1.46' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const HORIZONTAL_PADDING := 220.0' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const FRAMING_WIDTH := 1120.0' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const MIN_FRAMING_SPAN := 760.0' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const CLOSE_FIGHT_DISTANCE := 520.0' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const CLOSE_FIGHT_ZOOM_FLOOR := 1.40' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const BASELINE_Y := 530.0' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'const VERTICAL_RANGE := 60.0' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'world_fighter_scale_changes' scripts/vertical_slice/first_playable_camera_composition.gd
          grep -q 'single_production_owner' scripts/vertical_slice/first_playable.gd
          echo 'P0_2_SCREEN_PRESENCE_CAMERA_CONTRACT=PASS stage_premium=true far_safe=true close_strong=true'

      - name: Verify visual runtime dependencies
        run: |
          set -euo pipefail
          command -v unzip
          command -v xvfb-run
          ldconfig -p | grep -q 'libGL.so.1'
          ldconfig -p | grep -q 'libfontconfig.so.1'
          echo 'P0_2_SCREEN_PRESENCE_RUNTIME_DEPS=PASS preinstalled=true'

      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee p0-2-screen-presence-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' p0-2-screen-presence-import.log; then
            echo 'P0_2_SCREEN_PRESENCE_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Capture far and close fighter framing
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/ci/p0_2_fighter_screen_presence_review.gd \
            2>&1 | tee p0-2-screen-presence-review.log
          grep -q 'P0_2_FIGHTER_FAR_FRAMING=PASS' p0-2-screen-presence-review.log
          grep -q 'P0_2_FIGHTER_CLOSE_PRESENCE=PASS' p0-2-screen-presence-review.log
          grep -q 'P0_2_FIGHTER_WORLD_SCALE=UNCHANGED' p0-2-screen-presence-review.log
          grep -q 'P0_2_FIGHTER_SCREEN_PRESENCE_REVIEW=PASS' p0-2-screen-presence-review.log
          grep -q 'SIGNATURE=Tehkné Solutions' p0-2-screen-presence-review.log
          test -f artifacts/p0_2_screen_presence/P0_2_FIGHTER_SCREEN_PRESENCE.far-1920x1080.png
          test -f artifacts/p0_2_screen_presence/P0_2_FIGHTER_SCREEN_PRESENCE.close-1920x1080.png
          test -f artifacts/p0_2_screen_presence/P0_2_FIGHTER_SCREEN_PRESENCE_METRICS.json
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error|P0_2_SCREEN_PRESENCE=BLOCKED' p0-2-screen-presence-review.log; then
            echo 'P0_2_FIGHTER_SCREEN_PRESENCE_REVIEW=BLOCKED runtime_error'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0-2-FIGHTER-SCREEN-PRESENCE-EVIDENCE
          path: |
            p0-2-screen-presence-c30.log
            p0-2-screen-presence-import.log
            p0-2-screen-presence-review.log
            artifacts/p0_2_screen_presence/P0_2_FIGHTER_SCREEN_PRESENCE.far-1920x1080.png
            artifacts/p0_2_screen_presence/P0_2_FIGHTER_SCREEN_PRESENCE.close-1920x1080.png
            artifacts/p0_2_screen_presence/P0_2_FIGHTER_SCREEN_PRESENCE_METRICS.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'P0.2 fighter screen presence — Stage Premium far-safe + close-combat framing — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"

# Tehkné Solutions
