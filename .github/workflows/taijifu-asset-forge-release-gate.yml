name: Taijifu Asset Forge Release Gate

on:
  pull_request:
    paths:
      - 'tools/asset_forge/**'
      - 'asset-forge/release/**'
      - 'tests/asset_forge/**'
      - '.github/workflows/taijifu-asset-forge-release-gate.yml'
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tgap-test.txt
      - run: python -m pip install -r requirements-tgap-test.txt
      - run: python -m pytest -q tests/asset_forge/test_approval_gate.py
      - name: Confirmar bloqueio sem aprovação e sem intake
        run: |
          set +e
          python tools/asset_forge/release_pipeline.py asset-forge/release/pack_01_lian_wu_base.json --strict
          code=$?
          set -e
          test "$code" -eq 11
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/asset-forge/pack_01_lian_wu_base__release-pipeline.json').read_text(encoding='utf-8'))
          assert report['schema'] == 'taijifu/asset-forge-release-pipeline/v3'
          assert report['ready'] is False
          assert report['bundle_promoted'] is False
          print('ASSET_FORGE_RELEASE_BLOCK=PASS exit=11 ready=false bundle_promoted=false')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asset-forge-pack01-release-gate-diagnostic
          path: artifacts/asset-forge/pack_01_lian_wu_base__release-pipeline.json
          if-no-files-found: error
