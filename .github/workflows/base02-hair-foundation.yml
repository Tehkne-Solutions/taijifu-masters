name: C66.0 BASE-02 Hair Foundation

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_02/**'
      - 'scripts/characters/modular_fighter_layer_policy.gd'
      - 'scripts/ci/base02_hair_foundation_smoke.gd'
      - 'config/modular-fighter-standard-v1.json'
      - '.github/workflows/base02-hair-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hair-foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate BASE-02 foundation invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          manifest = json.loads(Path('assets/modular_fighters/base_02/manifest.json').read_text())
          contract = json.loads(Path('assets/modular_fighters/base_02/production/BASE02_HAIR_FOUNDATION.json').read_text())
          standard = json.loads(Path('config/modular-fighter-standard-v1.json').read_text())

          assert manifest['signature'] == 'Tehkné Solutions'
          assert manifest['pack_id'] == 'BASE02_HAIR'
          assert manifest['default_style_id'] == 'hair_none'
          none_style = manifest['styles']['hair_none']
          assert none_style['hair_back'] is None
          assert none_style['hair_front'] is None
          assert none_style['production_ready'] is True

          assert contract['component_id'] == 'BASE02_HAIR_FOUNDATION'
          assert contract['stage'] == 'C66.0'
          style_contract = contract['style_contract']
          assert style_contract['creator_selection_unit'] == 'hair_style'
          assert style_contract['atomic_pair_slots'] == ['hair_back', 'hair_front']
          assert style_contract['cross_style_mixing'] is False

          for slot in ('hair_back', 'hair_front'):
              assert slot in standard['slots']
              assert slot in standard['creator_v1_editable_slots']

          status = manifest['status']
          pngs = list(Path('assets/modular_fighters/base_02').rglob('*.png'))
          if status == 'foundation_no_art_assets':
              assert manifest['modules'] == {}
              assert manifest['promotion']['art_assets_present'] is False
              assert manifest['promotion']['battle_activation'] is False
              assert not pngs, f'foundation must not silently promote hair PNGs: {pngs}'
              stage = 'foundation_no_art_assets'
          else:
              assert manifest['modules'], 'promoted BASE-02 pack must expose modules'
              assert manifest['promotion']['art_assets_present'] is True
              assert pngs, 'promoted BASE-02 pack must contain approved Hair PNGs'
              stage = 'promoted_pack_preserving_foundation'

          print(f'C66_0_STATIC_CONTRACT=PASS stage={stage} creator_exposure={str(manifest["promotion"].get("creator_exposure", False)).lower()}')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          ./godot --headless --path . --import 2>&1 | tee c66-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed' c66-import.log; then
            echo 'C66_0_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run BASE-02 Hair foundation invariant smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base02_hair_foundation_smoke.gd 2>&1 | tee c66-hair-foundation.log
          grep -q 'C66_0_HAIR_FOUNDATION=PASS' c66-hair-foundation.log
          grep -q 'C66_0_FOUNDATION_INVARIANTS=PASS' c66-hair-foundation.log
          grep -q 'C66_0_HAIR_LAYER_ORDER=PASS' c66-hair-foundation.log
          grep -q 'C66_0_ART_STAGE=' c66-hair-foundation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C66_0_HAIR_FOUNDATION=BLOCKED' c66-hair-foundation.log; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C66-0-BASE02-HAIR-FOUNDATION-EVIDENCE
          path: |
            c66-import.log
            c66-hair-foundation.log
            assets/modular_fighters/base_02/manifest.json
            assets/modular_fighters/base_02/production/BASE02_HAIR_FOUNDATION.json
          if-no-files-found: error

      - name: Summary
        run: echo 'C66.0 BASE-02 Hair Foundation invariants — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
