name: Taijifu Asset Forge Release v2

on:
  pull_request:
    paths:
      - "tools/asset_forge/**"
      - "asset-forge/**"
      - "tests/asset_forge/**"
      - ".github/workflows/taijifu-asset-forge-release-v2.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow pytest
      - run: python -m pytest -q tests/asset_forge/test_diff_matrix.py
      - name: Confirm Pack 01 remains blocked without physical assets
        run: |
          set +e
          python tools/asset_forge/release_pipeline.py asset-forge/release/pack_01_lian_wu_base.json --strict
          code=$?
          test "$code" -eq 11
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-asset-forge-release-v2-diagnostics
          path: artifacts/asset-forge/
          if-no-files-found: ignore
