name: C66.1 One-shot Hair Binary Materialization

on:
  pull_request:
    paths:
      - 'tools/materialize_base02_lian_topknot.py'
      - '.github/workflows/c66-1-hair-promote-once.yml'

permissions:
  contents: write

jobs:
  materialize-on-feature-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/c66-1-lian-topknot-hair-pack'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed Hair source-pixel split
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pillow==11.1.0
          python tools/materialize_base02_lian_topknot.py 2>&1 | tee c66-1-materialize.log
          grep -q 'C66_1_MATERIALIZE=PASS style=hair_01_lian_topknot' c66-1-materialize.log
          grep -q 'C66_1_SOURCE_PIXELS=PASS redraw=false resampling=false mutation=false' c66-1-materialize.log
          test -s assets/modular_fighters/base_02/hair_01_lian_topknot/hair_01_lian_topknot_back.png
          test -s assets/modular_fighters/base_02/hair_01_lian_topknot/hair_01_lian_topknot_front.png
          test -s assets/modular_fighters/base_02/production/BASE02_HAIR_PACK_01_LIAN_TOPKNOT.json

      - name: Commit exact materialized candidate once
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'Tehkné Solutions Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            assets/modular_fighters/base_02/manifest.json \
            assets/modular_fighters/base_02/hair_01_lian_topknot/hair_01_lian_topknot_back.png \
            assets/modular_fighters/base_02/hair_01_lian_topknot/hair_01_lian_topknot_front.png \
            assets/modular_fighters/base_02/production/BASE02_HAIR_PACK_01_LIAN_TOPKNOT.json
          if git diff --cached --quiet; then
            echo 'C66_1_PROMOTION_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m 'art(c66.1): materialize Lian topknot Hair candidate'
          git push origin "HEAD:${BRANCH}"
          echo 'C66_1_PROMOTION_COMMIT=PASS'

      - name: Summary
        run: echo 'C66.1 one-shot binary materialization only; workflow must be deleted before main promotion — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
