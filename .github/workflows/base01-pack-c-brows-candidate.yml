name: BASE-01 Pack C Brows Candidate

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_01/production/BASE01_PACK_C_BROWS*'
      - 'scripts/art/generate_base01_pack_c_brows.py'
      - 'scripts/art/refine_base01_pack_c_brows.py'
      - 'scripts/ci/base01_pack_c_brows_candidate_smoke.gd'
      - '.github/workflows/base01-pack-c-brows-candidate.yml'
      - 'assets/modular_fighters/base_01/brows/brows_01_focused.png'
      - 'assets/modular_fighters/base_01/face_plate/neutral_face_plate_v1.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Generate Pack C candidates
        run: python scripts/art/generate_base01_pack_c_brows.py --repo-root . --output build/base01-pack-c-brows
      - name: Refine Heavy brow candidate
        run: python scripts/art/refine_base01_pack_c_brows.py --repo-root . --brows-dir build/base01-pack-c-brows
      - name: Stage candidates under res
        run: |
          mkdir -p assets/modular_fighters/base_01/_ci_brow_candidates
          cp build/base01-pack-c-brows/brows_0*.png assets/modular_fighters/base_01/_ci_brow_candidates/
      - name: Download Godot 4.3 stable
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project with candidates
        run: |
          set -o pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c61-import.log
      - name: Validate candidate runtime assembly
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/ci/base01_pack_c_brows_candidate_smoke.gd 2>&1 | tee c61-runtime.log
          grep -q 'C61_PACK_C_BROWS_RUNTIME=PASS candidates=5' c61-runtime.log
      - name: Publish review artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASE01-PACK-C-BROWS-CANDIDATES-${{ github.sha }}
          path: |
            build/base01-pack-c-brows/
            c61-import.log
            c61-runtime.log
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          echo 'C61 Pack C brow candidates PASS; owner review PENDING — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
