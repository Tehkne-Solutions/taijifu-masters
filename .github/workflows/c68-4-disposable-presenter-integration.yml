name: C68.4 Disposable Presenter Integration

on:
  pull_request:
    paths:
      - '.github/workflows/c68-4-disposable-presenter-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch presenter deterministically
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('scripts/vertical_slice/first_playable_modular_fighter_presenter.gd')
          src=path.read_text(encoding='utf-8')

          def replace_once(old,new):
              global src
              assert src.count(old)==1, (old[:80],src.count(old))
              src=src.replace(old,new,1)

          replace_once(
            'var _back_accessory_id: StringName = &"back_none"\n',
            'var _back_accessory_id: StringName = &"back_none"\nvar _weapon_back_id: StringName = &""\n'
          )
          replace_once(
            'func active_back_accessory_id() -> StringName:\n\treturn _back_accessory_id\n',
            'func active_back_accessory_id() -> StringName:\n\treturn _back_accessory_id\n\nfunc active_weapon_back_id() -> StringName:\n\treturn _weapon_back_id\n'
          )
          replace_once(
            '\t\t"back_accessory_id": String(_back_accessory_id),\n',
            '\t\t"back_accessory_id": String(_back_accessory_id),\n\t\t"weapon_back_id": String(_weapon_back_id),\n'
          )
          replace_once(
            '\t_hair_style_id = ModularFighterHairRuntime.profile_style_id(profile as ModularFighterProfile)\n\n\t# C67 composes the atomic BASE-03 uniform set after Hair.\n',
            '\t_hair_style_id = ModularFighterHairRuntime.profile_style_id(profile as ModularFighterProfile)\n\n\t# C68.4 composes shared visual equipment independently from combat loadout logic.\n\tfailures = ModularFighterEquipmentRuntime.assemble_profile(profile as ModularFighterProfile, candidate)\n\tif not failures.is_empty():\n\t\tcandidate.queue_free()\n\t\tprint("C68_4_MODULAR_PRESENTER=BLOCKED reason=equipment_assembly failures=%s" % ",".join(failures))\n\t\treturn\n\t_weapon_back_id = (profile as ModularFighterProfile).module_id(&"weapon_back")\n\n\t# C67 composes the atomic BASE-03 uniform set after Hair.\n'
          )
          replace_once(
            '\tif _armor_set_id != &"armor_none" or _back_accessory_id != &"back_none":\n',
            '\tif not String(_weapon_back_id).is_empty():\n\t\tvar equipment_signature := ModularFighterEquipmentRuntime.runtime_signature(profile as ModularFighterProfile, _assembler)\n\t\tvar weapon_back = equipment_signature.get("nodes", {}).get("weapon_back", {})\n\t\tprint("C68_4_EQUIPMENT_RUNTIME=PASS weapon_back=%s z=%d" % [String(_weapon_back_id), int(weapon_back.get("z", -1))])\n\tif _armor_set_id != &"armor_none" or _back_accessory_id != &"back_none":\n'
          )
          replace_once(
            '\thandoff["back_accessory_id"] = String(_back_accessory_id)\n',
            '\thandoff["back_accessory_id"] = String(_back_accessory_id)\n\thandoff["weapon_back_id"] = String(_weapon_back_id)\n'
          )
          path.write_text(src,encoding='utf-8')

          manifest_path=Path('assets/modular_fighters/shared_equipment/manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['promotion']['runtime_activation'] is True
          assert manifest['modules']['sheath_lian_wu_blue']['production_ready'] is True
          manifest['promotion']['presenter_integration']=True
          manifest['promotion']['creator_exposure']=False
          manifest['promotion']['blocker']='active_fight_validation_required'
          manifest['next_stage']='C68.4 — definitive active-fight validation and evidence closeout'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('C68_4_PRESENTER_PATCH=PASS equipment_runtime=enabled creator=false')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import and reject parser/resource regressions
        run: |
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c68-4-presenter-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|ERR_FILE_CORRUPT' c68-4-presenter-import.log; then exit 1; fi

      - name: Require real active-fight activation before push
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://scripts/ci/c68_4_active_fight_visual_review.gd 2>&1 | tee c68-4-active-fight.log
          grep -q 'C68_4_ACTIVE_FIGHT=PASS weapon_back=sheath_lian_wu_blue back=back_01_guardian_panel auto_activation=true handoff=true' c68-4-active-fight.log
          grep -q 'C68_4_ACTIVE_LAYERING=PASS weapon_back=3 back_accessory=4 hair_back=5' c68-4-active-fight.log
          test -s artifacts/c68_4/C68_4_ACTIVE_FIGHT.review-1920x1080.png
          if grep -Eq 'SCRIPT ERROR|Parse Error|C68_4_ACTIVE_FIGHT=BLOCKED' c68-4-active-fight.log; then exit 1; fi

      - name: Commit only active-fight validated integration
        run: |
          set -euo pipefail
          git config user.name 'Tehkné Solutions'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/vertical_slice/first_playable_modular_fighter_presenter.gd assets/modular_fighters/shared_equipment/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'C68.4 — integrate weapon_back and Back Accessory in battle presenter'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
