name: TGAP Validator Tests

on:
  pull_request:
    paths:
      - "scripts/tgap_*.py"
      - "tests/tgap/**"
      - "requirements-tgap-test.txt"
      - ".github/workflows/tgap-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/tgap_*.py"
      - "tests/tgap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgap-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-tgap.txt
            requirements-tgap-test.txt
      - name: Instalar dependências
        run: pip install -r requirements-tgap.txt -r requirements-tgap-test.txt
      - name: Executar suíte TGAP
        run: pytest -q tests/tgap --junitxml=tgap-test-results.xml
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgap-tests-python-${{ matrix.python-version }}
          path: tgap-test-results.xml
          if-no-files-found: warn
