name: AUDIO-02 Controller Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/audio02-canonical-sound-design'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch First Playable presentation cues atomically
        run: |
          python3 tools/audio02_patch_first_playable.py
          grep -q 'signal presentation_cue_requested' scripts/vertical_slice/first_playable.gd
          grep -q 'presentation_cue_requested.emit(&"countdown"' scripts/vertical_slice/first_playable.gd
          grep -q 'presentation_cue_requested.emit(&"fight"' scripts/vertical_slice/first_playable.gd
          grep -q 'presentation_cue_requested.emit(&"ko"' scripts/vertical_slice/first_playable.gd
          grep -q 'presentation_cue_requested.emit(&"round_win" if player_won else &"round_loss"' scripts/vertical_slice/first_playable.gd
          grep -q 'presentation_cue_requested.emit(&"ui_pause" if active else &"ui_resume"' scripts/vertical_slice/first_playable.gd

      - name: Remove disposable writer
        run: |
          rm tools/audio02_patch_first_playable.py
          rm .github/workflows/audio02-controller-materializer.yml

      - name: Commit materialized product
        run: |
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add scripts/vertical_slice/first_playable.gd tools/audio02_patch_first_playable.py .github/workflows/audio02-controller-materializer.yml
          git diff --cached --check
          git commit -m 'AUDIO-02: wire canonical round and UI presentation cues'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
