name: Multi Ghost Race CI

on:
  pull_request:
    paths:
      - 'scripts/runtime/multi_ghost_race_runtime.gd'
      - 'scripts/ci/multi_ghost_race_smoke_test.gd'
      - 'project.godot'
      - '.github/workflows/multi-ghost-race-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/runtime/multi_ghost_race_runtime.gd'
      - 'scripts/ci/multi_ghost_race_smoke_test.gd'
      - 'project.godot'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          mkdir -p .cache/godot
          curl -L --fail -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d .cache/godot
          mv .cache/godot/Godot_v4.3-stable_linux.x86_64 .cache/godot/godot
          chmod +x .cache/godot/godot
      - name: Import project
        run: .cache/godot/godot --headless --editor --path . --quit
      - name: Run multi ghost race smoke test
        run: .cache/godot/godot --headless --path . --script res://scripts/ci/multi_ghost_race_smoke_test.gd