name: C63 Lian Release Recovery Probe

on:
  push:
    branches:
      - 'agent/c63-0-lian-release-recovery'
    paths:
      - '.recovery/c63-lian-release.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download official Pack 01 release
        run: |
          set -euo pipefail
          URL='https://github.com/Tehkne-Solutions/taijifu-masters-assets/releases/download/assets-pack-01-v1.0.1/PACK_01_LIAN_WU_BASE_FINAL_v1.0.1.zip'
          curl --fail --location --retry 3 --output /tmp/pack01.zip "$URL"
          test -s /tmp/pack01.zip
          sha256sum /tmp/pack01.zip | tee c63-release-zip.sha256
          unzip -t /tmp/pack01.zip >/dev/null
          echo 'C63_RELEASE_DOWNLOAD=PASS'

      - name: Inspect archive for canonical Character Lock lineage
        run: |
          set -euo pipefail
          rm -rf /tmp/c63-pack && mkdir -p /tmp/c63-pack
          unzip -q /tmp/pack01.zip -d /tmp/c63-pack
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root=Path('/tmp/c63-pack')
          expected={
            'neutral':'0e435757b5c8a114f3ba91653f79bc86db51ee9cf3bfb74c529efed5d4ff7ab5',
            'combat_stance':'c8e6cd1feece7c2a54cf2279085c2a4bb33338dd6a3dcb3e4d5a2402b537631c',
          }
          matches={key:[] for key in expected}
          pngs=[]
          for path in sorted(root.rglob('*.png')):
            digest=hashlib.sha256(path.read_bytes()).hexdigest()
            rel=path.relative_to(root).as_posix()
            pngs.append({'path':rel,'sha256':digest,'size_bytes':path.stat().st_size})
            for key, want in expected.items():
              if digest==want:
                matches[key].append(rel)
          report={
            'schema':'tehkne/c63-lian-release-probe/v1',
            'signature':'Tehkné Solutions',
            'png_count':len(pngs),
            'matches':matches,
            'pngs':pngs,
          }
          Path('c63-release-probe.json').write_text(json.dumps(report,indent=2)+'\n')
          print(f"C63_RELEASE_PNG_COUNT={len(pngs)}")
          print('C63_NEUTRAL_MATCHES='+str(matches['neutral']))
          print('C63_STANCE_MATCHES='+str(matches['combat_stance']))
          if not matches['neutral']:
            raise SystemExit('C63_RELEASE_PROBE=BLOCKED neutral_hash_missing')
          print('C63_RELEASE_PROBE=PASS neutral_hash_found')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C63-LIAN-RELEASE-PROBE
          path: |
            c63-release-zip.sha256
            c63-release-probe.json
          if-no-files-found: ignore

      - name: Summary
        run: echo 'C63.0 official Pack 01 release probe — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
