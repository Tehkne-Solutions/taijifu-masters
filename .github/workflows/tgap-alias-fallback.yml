name: TGAP Alias and Fallback

on:
  pull_request:
    paths:
      - "assets/tgap/aliases.json"
      - "scripts/runtime/tgap_asset_loader.gd"
      - "scripts/runtime/asset_pack_registry.gd"
      - "tests/tgap/test_alias_fallback_contract.py"
      - ".github/workflows/tgap-alias-fallback.yml"
  push:
    branches: [main]
    paths:
      - "assets/tgap/aliases.json"
      - "scripts/runtime/tgap_asset_loader.gd"
      - "scripts/runtime/asset_pack_registry.gd"
      - "tests/tgap/test_alias_fallback_contract.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/tgap/test_alias_fallback_contract.py
