name: Web Release

on:
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "web/**"
      - "web-tests/**"
      - "vercel.json"
      - "render.yaml"
      - ".github/workflows/web-release.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-web:
    name: Exportar Godot Web e validar Chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exportar build Web
        env:
          GODOT_VERSION: "4.3"
          GODOT_CHANNEL: stable
        run: |
          set -o pipefail
          bash scripts/build-web.sh 2>&1 | tee web-build.log

      - name: Validar manifestos First Playable Web
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("web-build/build-info.json")
          validation_path = Path("web-build/web-validation-info.json")
          assert manifest_path.is_file(), manifest_path
          assert validation_path.is_file(), validation_path

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schema"] == "tehkne/taijifu-first-playable-build/v1"
          assert manifest["platform"] == "web"
          assert manifest["channel"] == "external-playtest"
          assert manifest["version"] == "0.2.2-playtest"
          assert manifest["main_scene"] == "res://scenes/vertical_slice/first_playable_menu.tscn"
          assert manifest["battle_scene"] == "res://scenes/vertical_slice/first_playable.tscn"
          assert manifest["signature"] == "Tehkné Solutions"
          assert manifest["totals"]["file_count"] > 0
          telemetry = manifest["telemetry"]
          assert telemetry["schema"] == "tehkne/taijifu-match-telemetry/v3"
          assert telemetry["privacy"] == "local_only"
          assert telemetry["automatic_upload"] is False
          assert telemetry["post_match_balance_feedback"] is True
          assert telemetry["report_copy"] is True

          validation = json.loads(validation_path.read_text(encoding="utf-8"))
          assert validation["product"] == "Taijifu Masters"
          assert validation["publisher"] == "Tehkné Solutions"
          assert validation["web_contract"] == "sprint0-essential-shell-v1"
          features = validation["features"]
          assert features["godot_canvas"] is True
          assert features["direct_arena_entry"] is True
          assert features["pause_menu"] is True
          assert features["closable_dialog"] is True
          assert features["keyboard_escape"] is True
          assert features["responsive_shell"] is True
          assert features["pwa"] is True

          print(json.dumps({
              "build_id": manifest["build_id"],
              "version": manifest["version"],
              "files": manifest["totals"]["file_count"],
              "size_bytes": manifest["totals"]["size_bytes"],
              "web_validation": "approved",
              "web_contract": validation["web_contract"],
              "telemetry": "local-v3",
          }, indent=2))
          PY

      - name: Instalar Chromium do Playwright
        working-directory: web-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Servir e validar o First Playable no navegador
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web-build > web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              cat web-server.log
              exit 1
            fi
            sleep 1
          done

          npm --prefix web-tests test -- \
            web-smoke.spec.cjs \
            controller-mastery-web.spec.cjs \
            gamepad-web.spec.cjs \
            --reporter=line 2>&1 | tee web-test.log

      - name: Publicar build Web
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-masters-web-${{ github.sha }}
          path: web-build/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar evidências e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-web-smoke-${{ github.sha }}
          path: |
            web-import.log
            web-build.log
            web-server.log
            web-test.log
            web-tests/test-results/
          if-no-files-found: ignore
          retention-days: 14
