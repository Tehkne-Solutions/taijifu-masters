name: Asset Production Governance

on:
  pull_request:
    paths:
      - 'asset-forge/**'
      - 'assets/tgap/**'
      - 'tools/asset_forge/**'
      - '.github/workflows/asset-production-governance.yml'
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install Pillow
      - name: Validate Lian Wu budget
        run: python tools/asset_forge/asset_budget.py asset-forge/characters/lian_wu.json --strict
      - name: Generate production board
        run: python tools/asset_forge/production_board.py asset-forge/characters/lian_wu.json
      - name: Generate consolidated index
        run: python tools/asset_forge/character_index.py
      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-asset-production-governance
          if-no-files-found: warn
          path: |
            artifacts/asset-forge/index/
            artifacts/asset-forge/boards/
            artifacts/asset-forge/budgets/
            artifacts/asset-forge/review/
            artifacts/asset-forge/*release-pipeline.json
