name: P0.2 Canonical Visual Authority

on:
  pull_request:
    paths:
      - 'scripts/vertical_slice/first_playable_lot01_presenter.gd'
      - 'scripts/vertical_slice/training_rival_lot01_presenter.gd'
      - 'scripts/vertical_slice/first_playable_modular_fighter_presenter.gd'
      - 'scripts/vertical_slice/first_playable_modular_pose_runtime.gd'
      - 'scripts/fighter/fighter_controller.gd'
      - 'tests/p0_2_canonical_visual_authority_product_test.gd'
      - 'scripts/ci/p0_2_canonical_visual_authority_review.gd'
      - '.github/workflows/p0-2-canonical-visual-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-visual-authority:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Materialize canonical First Playable snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-p02-visual-authority'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath p0-2-visual-authority-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require canonical snapshot authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VM02_C30_SOURCE_PIN=PASS' p0-2-visual-authority-c30.log
          grep -q 'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89' p0-2-visual-authority-c30.log
          grep -q 'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS' p0-2-visual-authority-c30.log
          echo 'P0_2_CANONICAL_VISUAL_SNAPSHOT=PASS'

      - name: Install visual runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee p0-2-visual-authority-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' p0-2-visual-authority-import.log; then
            echo 'P0_2_CANONICAL_VISUAL_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run canonical visual authority product gate
        run: |
          set -o pipefail
          timeout 60s ./godot --headless --audio-driver Dummy --path . \
            --script res://tests/p0_2_canonical_visual_authority_product_test.gd \
            2>&1 | tee p0-2-visual-authority-product.log
          grep -q 'P0_2_CANONICAL_VISUAL_AUTHORITY=PASS p1=true p2=true' p0-2-visual-authority-product.log
          grep -q 'P0_2_PROVISIONAL_FIGHTER_DRAW=RETIRED p1=true p2=true self_modulate_alpha=0' p0-2-visual-authority-product.log
          grep -q 'P0_2_CANONICAL_CHILD_PRESENTERS=PASS p1=modular_polygon p2=lot01_sprite' p0-2-visual-authority-product.log
          grep -q 'P0_2_CANONICAL_VISUAL_PRODUCT_GATE=PASS' p0-2-visual-authority-product.log
          grep -q 'SIGNATURE=Tehkné Solutions' p0-2-visual-authority-product.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error|P0_2_CANONICAL_VISUAL_GATE=BLOCKED' p0-2-visual-authority-product.log; then
            echo 'P0_2_CANONICAL_VISUAL_PRODUCT_GATE=BLOCKED runtime_error'
            exit 1
          fi

      - name: Capture canonical active-round fighters
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/ci/p0_2_canonical_visual_authority_review.gd \
            2>&1 | tee p0-2-visual-authority-review.log
          grep -q 'P0_2_PROVISIONAL_FIGHTER_DRAW=RETIRED p1=true p2=true' p0-2-visual-authority-review.log
          grep -q 'P0_2_CANONICAL_CHILD_RENDER=PASS p1=modular_polygon p2=lot01_sprite' p0-2-visual-authority-review.log
          grep -q 'P0_2_ACTIVE_ROUND_ONBOARDING=RELEASED guide=hidden' p0-2-visual-authority-review.log
          grep -q 'P0_2_CANONICAL_VISUAL_AUTHORITY_REVIEW=PASS' p0-2-visual-authority-review.log
          grep -q 'SIGNATURE=Tehkné Solutions' p0-2-visual-authority-review.log
          test -f artifacts/p0_2_visual_authority/P0_2_CANONICAL_FIGHTERS.neutral-1920x1080.png
          test -f artifacts/p0_2_visual_authority/P0_2_CANONICAL_FIGHTERS.attack-1920x1080.png
          test -f artifacts/p0_2_visual_authority/P0_2_CANONICAL_VISUAL_AUTHORITY_METRICS.json
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error|P0_2_VISUAL_AUTHORITY_REVIEW=BLOCKED' p0-2-visual-authority-review.log; then
            echo 'P0_2_CANONICAL_VISUAL_AUTHORITY_REVIEW=BLOCKED runtime_error'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0-2-CANONICAL-VISUAL-AUTHORITY-EVIDENCE
          path: |
            p0-2-visual-authority-c30.log
            p0-2-visual-authority-import.log
            p0-2-visual-authority-product.log
            p0-2-visual-authority-review.log
            artifacts/p0_2_visual_authority/P0_2_CANONICAL_FIGHTERS.neutral-1920x1080.png
            artifacts/p0_2_visual_authority/P0_2_CANONICAL_FIGHTERS.attack-1920x1080.png
            artifacts/p0_2_visual_authority/P0_2_CANONICAL_VISUAL_AUTHORITY_METRICS.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'P0.2 canonical visual authority — provisional fighter draw retired behind real presenters — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"

# Tehkné Solutions