name: First Playable Release Gate

on:
  pull_request:
    paths:
      - "scripts/vertical_slice/**"
      - "scripts/runtime/impact_director.gd"
      - "scenes/vertical_slice/**"
      - "assets/tgap/pack_01_lian_wu/**"
      - "assets/tgap/training_rival/**"
      - "config/v2-arena-intake-contract.json"
      - "tests/first_playable_*"
      - "tests/training_rival_*"
      - "tests/test_first_playable_lot01_importer.py"
      - "tests/test_training_rival_lot01_importer.py"
      - "tests/test_art_preflight_report_gate.py"
      - "tools/asset_forge/**"
      - "tools/release/**"
      - "tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1"
      - ".github/workflows/first-playable-release-gate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4

      - name: Checkout do snapshot composto canônico
        uses: actions/checkout@v4
        with:
          repository: Tehkne-Solutions/taijifu-masters-assets
          ref: assets-first-playable-v1.0.0
          path: external/taijifu-masters-assets
          lfs: false
          fetch-depth: 1

      - name: Materializar somente LFS do First Playable
        working-directory: external/taijifu-masters-assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include='production/first_playable/lian_wu/first_playable_lot_01/animations/**,production/first_playable/training_rival/first_playable_lot_01/animations/**,packs/stages/mountain_dojo_night/v1/*.png' \
            --exclude=''
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED=b6767d9d30fb2980de5d0a57a8a4c414b854cad5
          test "$ACTUAL" = "$EXPECTED"
          echo "FIRST_PLAYABLE_ASSET_SNAPSHOT=PASS ref=assets-first-playable-v1.0.0 commit=$ACTUAL"

      - name: Validar freeze e contrato do snapshot composto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('config/v2-arena-intake-contract.json').read_text(encoding='utf-8'))
          freeze = json.loads(Path('external/taijifu-masters-assets/releases/first-playable-v1.freeze.json').read_text(encoding='utf-8'))
          assert contract['signature'] == 'Tehkné Solutions'
          assert contract['source_ref'] == 'assets-first-playable-v1.0.0'
          assert contract['source_commit'] == 'b6767d9d30fb2980de5d0a57a8a4c414b854cad5'
          assert contract['source_release_sha256'] == '69b6b4641fb93bffa81555926887d44a0dfed5edaa4368b8a58a62f689bd58d2'
          assert contract['source_content_sha256'] == 'b2b4e8e274cd1a819d3062c237907132b4067c3aac4a33ef2d7230e73f565eec'
          assert contract['import_policy']['immutable_source_ref'] is True
          assert contract['import_policy']['verify_source_commit'] is True
          assert contract['import_policy']['verify_snapshot_freeze'] is True
          assert contract['import_policy']['auto_fast_forward_assets_repo'] is False
          assert contract['snapshot_contract']['fighter_frames'] == 89
          assert contract['snapshot_contract']['fighter_animations'] == 20
          assert contract['snapshot_contract']['stage_layers'] == 3
          assert freeze['signature'] == 'Tehkné Solutions'
          assert freeze['tag'] == contract['source_ref']
          assert freeze['sha256'] == contract['source_release_sha256']
          assert freeze['content_sha256'] == contract['source_content_sha256']
          assert freeze['fighter_frames'] == 89
          assert freeze['fighter_animations'] == 20
          assert freeze['stage_layers'] == 3
          print('FIRST_PLAYABLE_SNAPSHOT_FREEZE=PASS frames=89 animations=20 stage_layers=3')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Executar C30 sobre o mesmo snapshot pinado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $PWD 'external/taijifu-masters-assets'
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath first-playable-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content first-playable-c30.log -Raw
          foreach ($required in @(
            'VM02_C30_SOURCE_PIN=PASS',
            'VM02_C30_SNAPSHOT_FREEZE=PASS',
            'VM02_C30_SNAPSHOT_LIAN=PASS frames=45 animations=10',
            'VM02_C30_SNAPSHOT_RIVAL=PASS frames=44 animations=10',
            'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89',
            'VM02_C30_SNAPSHOT_STAGE=PASS layers=3',
            'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS',
            'VM02_C30_ARENA_CANONICAL_READY=PASS'
          )) {
            if (-not $log.Contains($required)) { throw "FIRST_PLAYABLE_C30=BLOCKED missing=$required" }
          }
          Write-Host 'FIRST_PLAYABLE_C30=PASS snapshot=assets-first-playable-v1.0.0'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: python -m pip install --upgrade pip pytest

      - name: Configurar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Importar projeto Godot completamente
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee first-playable-release-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' first-playable-release-import.log; then
            echo 'FIRST_PLAYABLE_RELEASE_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Gerar relatório artístico canônico v3 estrito
        shell: bash
        run: |
          set -euo pipefail
          python external/taijifu-masters-assets/tools/validate_first_playable_art_production_v3.py \
            --report ../../artifacts/first-playable-art-preflight-v3.json | tee first-playable-art-v3.log
          grep -q 'FIRST_PLAYABLE_ART_PRODUCTION_READY=true' first-playable-art-v3.log
          grep -q 'FIRST_PLAYABLE_ART_PROGRESS=89/89' first-playable-art-v3.log
          python tools/release/validate_art_preflight_report.py \
            artifacts/first-playable-art-preflight-v3.json \
            --strict

      - name: Executar gate de integração estrito
        shell: bash
        run: |
          set -euo pipefail
          python tools/release/run_first_playable_release_gate.py \
            --art-report artifacts/first-playable-art-preflight-v3.json \
            --strict-assets

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-playable-release-gate
          path: |
            artifacts/first-playable-release-gate.json
            artifacts/first-playable-art-preflight-v3.json
            first-playable-release-import.log
            first-playable-c30.log
            first-playable-art-v3.log
          if-no-files-found: warn
          retention-days: 14

# Tehkné Solutions
