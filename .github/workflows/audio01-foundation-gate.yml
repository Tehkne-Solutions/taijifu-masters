name: AUDIO-01 Foundation Gate

on:
  pull_request:
    paths:
      - 'scenes/vertical_slice/first_playable.tscn'
      - 'scripts/vertical_slice/first_playable_audio_director.gd'
      - 'scripts/ci/audio01_foundation_bench.gd'
      - 'config/audio01-foundation-evidence.json'
      - '.github/workflows/audio01-foundation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio01-foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate frozen AUDIO-01 evidence contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/audio01-foundation-evidence.json')
          if not path.exists():
              raise SystemExit('AUDIO01_EVIDENCE=BLOCKED missing')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema'] == 'tehkne/taijifu-audio01-foundation-evidence/v1'
          assert data['signature'] == 'Tehkné Solutions'
          assert data['stage'] == 'AUDIO-01'
          assert data['status'] == 'pass'
          assert data['validated_product_head_sha'] == 'f3e370186ae9ced6b40cfc78ce8c4289dc8c8aa6'
          workflow = data['workflow']
          assert workflow['run_id'] == 31484939561
          assert workflow['job_id'] == 93758067434
          assert workflow['artifact_id'] == 9098721303
          assert workflow['artifact_name'] == 'AUDIO-01-FOUNDATION-EVIDENCE'
          assert workflow['artifact_digest'] == 'sha256:da4683de2a123a6b216353be817d8fc141232d8b4ee90af078257d5934b114e1'
          proof = data['proof']
          assert proof['scene_mount'] == 'pass'
          assert proof['fighter_connections'] == 2
          assert proof['impact_cues'] == ['hit', 'evade', 'block', 'parry', 'posture_break']
          assert proof['event_consumer_only'] is True
          assert proof['zero_health_mutation'] is True
          assert proof['zero_posture_mutation'] is True
          assert proof['zero_match_time_mutation'] is True
          assert proof['audio_stream_generator_present'] is True
          policy = data['runtime_policy']
          assert policy['gameplay_timing_owner'] is False
          assert policy['damage_owner'] is False
          assert policy['ai_owner'] is False
          assert policy['balance_changes'] is False
          print('AUDIO01_EVIDENCE=PASS')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project
        run: |
          set -o pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee audio01-import.log

      - name: Prove AUDIO-01 event-only foundation
        run: |
          set -o pipefail
          ./godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script res://scripts/ci/audio01_foundation_bench.gd \
            2>&1 | tee audio01-foundation.log
          grep -q 'AUDIO01_SCENE_MOUNT=PASS' audio01-foundation.log
          grep -q 'AUDIO01_FIGHTER_CONNECTIONS=PASS count=2' audio01-foundation.log
          grep -q 'AUDIO01_CUE_MAP=PASS hit evade block parry posture_break' audio01-foundation.log
          grep -q 'AUDIO01_EVENT_CONSUMER_ONLY=PASS' audio01-foundation.log
          grep -q 'AUDIO01_ZERO_GAMEPLAY_MUTATION=PASS' audio01-foundation.log
          grep -q 'AUDIO01_FOUNDATION=PASS' audio01-foundation.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AUDIO-01-FOUNDATION-EVIDENCE
          path: |
            audio01-import.log
            audio01-foundation.log
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'AUDIO-01 event-only combat audio foundation — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
