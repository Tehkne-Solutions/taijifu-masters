name: AUDIO-01 First Playable Audio Mount Materializer

on:
  pull_request:
    paths:
      - 'scripts/vertical_slice/first_playable_audio_director.gd'
      - 'tools/patch_audio01_scene_mount.py'
      - '.github/workflows/materialize-audio01-scene-mount.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/audio01-first-playable-foundation'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio01-first-playable-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch scene mount
        run: |
          python tools/patch_audio01_scene_mount.py | tee audio01-scene-patch.log
          grep -q 'AUDIO01_SCENE_PATCH=PASS mounted=AudioDirector' audio01-scene-patch.log
          grep -q 'first_playable_audio_director.gd' scenes/vertical_slice/first_playable.tscn
          grep -q '\[node name="AudioDirector" type="Node" parent="\."\]' scenes/vertical_slice/first_playable.tscn
      - name: Remove disposable writer and patcher
        run: |
          git rm -- .github/workflows/materialize-audio01-scene-mount.yml tools/patch_audio01_scene_mount.py
      - name: Commit mounted scene
        run: |
          set -euo pipefail
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@tehkne.solutions'
          git add -- scenes/vertical_slice/first_playable.tscn scripts/vertical_slice/first_playable_audio_director.gd
          git commit -m 'AUDIO-01: mount event-only combat audio foundation and remove writer'
          git push origin HEAD:agent/audio01-first-playable-foundation
          echo 'AUDIO01_SCENE_MOUNT=PASS writer_removed=true'
          echo 'AUDIO01_GAMEPLAY_OWNERSHIP=UNCHANGED'
          echo 'SIGNATURE=Tehkné Solutions'
