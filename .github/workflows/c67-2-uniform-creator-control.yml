name: C67.2 BASE-03 Uniform Creator Control

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_03/**'
      - 'scripts/characters/modular_fighter_creator_scene.gd'
      - 'scripts/characters/modular_fighter_uniform_runtime.gd'
      - 'scripts/ci/base03_uniform_creator_control_smoke.gd'
      - 'scripts/ci/base03_uniform_creator_visual_review.gd'
      - '.github/workflows/c67-2-uniform-creator-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uniform-creator-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate C67.2 public control contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('assets/modular_fighters/base_03/manifest.json').read_text())
          contract = json.loads(Path('assets/modular_fighters/base_03/production/BASE03_UNIFORM_CREATOR_CONTROL.json').read_text())
          assert manifest['pack_id'] == 'BASE03_MARTIAL_ARTS_UNIFORMS'
          assert manifest['promotion']['creator_exposure'] is True
          assert manifest['sets']['uniform_none']['production_ready'] is True
          assert manifest['sets']['uniform_01_lian_martial']['production_ready'] is True
          assert contract['component_id'] == 'BASE03_UNIFORM_CREATOR_CONTROL'
          assert contract['stage'] == 'C67.2'
          cc = contract['control_contract']
          assert cc['public_control'] == 'uniform_set'
          assert cc['internal_slots'] == ['torso_inner','torso_outer','arms','hands','waist','legs','feet']
          assert cc['direct_internal_slot_controls'] is False
          assert cc['cross_set_piece_mixing_allowed'] is False
          assert cc['initial_options'] == ['uniform_none','uniform_01_lian_martial']
          assert cc['live_preview'] is True
          assert cc['selection_transactional'] is True
          ui = contract['ui_contract']
          assert ui['option_node'] == 'UniformSetOption'
          assert ui['position'] == [600, 38]
          assert ui['size'] == [310, 42]
          assert ui['hair_option_position'] == [930, 38]
          assert ui['controls_overlap'] is False
          assert ui['base01_shell_rewritten'] is False
          assert ui['base02_hair_control_preserved'] is True
          print('C67_2_STATIC_CONTRACT=PASS unit=uniform_set options=2 slots=7')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3 and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c67-2-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed' c67-2-import.log; then
            echo 'C67_2_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Preserve C67.1 runtime and battle contract
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base03_uniform_pack_01_runtime_smoke.gd 2>&1 | tee c67-2-c67-1-regression.log
          grep -q 'C67_1_UNIFORM_PACK_RUNTIME=PASS' c67-2-c67-1-regression.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C67_1_RUNTIME=BLOCKED' c67-2-c67-1-regression.log; then
            exit 1
          fi

      - name: Preserve C66.2 Hair Creator control
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base02_hair_creator_control_smoke.gd 2>&1 | tee c67-2-c66-2-regression.log
          grep -q 'C66_2_HAIR_CREATOR_CONTROL=PASS' c67-2-c66-2-regression.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C66_2_CREATOR=BLOCKED' c67-2-c66-2-regression.log; then
            exit 1
          fi

      - name: Run Uniform Creator UI preview preset and battle smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base03_uniform_creator_control_smoke.gd 2>&1 | tee c67-2-runtime.log
          grep -q 'C67_2_UNIFORM_CONTROL=PASS options=2 unit=uniform_set' c67-2-runtime.log
          grep -q 'C67_2_DIRECT_SLOT_CONTROLS=ABSENT slots=7' c67-2-runtime.log
          grep -q 'C67_2_LIVE_PREVIEW=PASS modules=5 hair_preserved=true' c67-2-runtime.log
          grep -q 'C67_2_PRESET_ROUNDTRIP=PASS schema=v2 atomic_set=true' c67-2-runtime.log
          grep -q 'C67_2_BATTLE_HANDOFF=PASS set=uniform_01_lian_martial hair=hair_01_lian_topknot' c67-2-runtime.log
          grep -q 'C67_2_UNIFORM_CREATOR_CONTROL=PASS' c67-2-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C67_2_CREATOR=BLOCKED' c67-2-runtime.log; then
            exit 1
          fi

      - name: Capture reviewed Creator layout with Hair plus Uniform
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/ci/base03_uniform_creator_visual_review.gd \
            2>&1 | tee c67-2-visual.log
          grep -q 'C67_2_VISUAL_REVIEW=PASS set=uniform_01_lian_martial hair=hair_01_lian_topknot' c67-2-visual.log
          grep -q 'C67_2_VISUAL_LAYOUT=PASS uniform_control=true hair_control=true overlap=false expansion_aware=true' c67-2-visual.log
          grep -q 'C67_2_VISUAL_PREVIEW=PASS uniform_modules=5 hair_nodes=2' c67-2-visual.log
          test -s artifacts/c67_2/C67_2_UNIFORM_CREATOR_CONTROL.review-1280x720.png
          if grep -Eq 'SCRIPT ERROR|Parse Error|C67_2_VISUAL=BLOCKED' c67-2-visual.log; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C67-2-BASE03-UNIFORM-CREATOR-CONTROL-EVIDENCE
          path: |
            c67-2-import.log
            c67-2-c67-1-regression.log
            c67-2-c66-2-regression.log
            c67-2-runtime.log
            c67-2-visual.log
            artifacts/c67_2/C67_2_UNIFORM_CREATOR_CONTROL.review-1280x720.png
            assets/modular_fighters/base_03/manifest.json
            assets/modular_fighters/base_03/production/BASE03_UNIFORM_CREATOR_CONTROL.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'C67.2 BASE-03 Uniform Creator Control gate — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
