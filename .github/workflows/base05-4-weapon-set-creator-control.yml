name: BASE-05.4 Weapon Set Creator Control

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_05/**'
      - 'assets/modular_fighters/shared_equipment/**'
      - 'scenes/characters/modular_fighter_creator_shell.tscn'
      - 'scripts/characters/modular_fighter_creator_scene.gd'
      - 'scripts/characters/modular_fighter_creator_bounded_scene.gd'
      - 'scripts/characters/modular_fighter_equipment_runtime.gd'
      - 'scripts/vertical_slice/first_playable_modular_fighter_presenter.gd'
      - 'scripts/ci/base05_4_weapon_set_creator_control_smoke.gd'
      - '.github/workflows/base05-4-weapon-set-creator-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weapon-set-creator-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Validate BASE-05.4 static atomic Creator contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/modular_fighters/base_05/manifest.json').read_text())
          c=json.loads(Path('assets/modular_fighters/base_05/production/BASE05_WEAPON_SET_CREATOR_CONTROL.json').read_text())
          r=json.loads(Path('assets/modular_fighters/base_05/production/BASE05_KATANA_LIAN_WU_PACK_01_RUNTIME.json').read_text())
          source=Path('scripts/characters/modular_fighter_creator_scene.gd').read_text()

          assert m['pack_id']=='BASE05_WEAPONS'
          assert m['status'] in ('weapon_set_creator_validation_pending','production_approved_weapon_set_creator_control')
          assert m['promotion']['weapon_main_runtime_activation'] is True
          assert m['promotion']['weapon_offhand_runtime_activation'] is False
          assert m['promotion']['creator_exposure'] is True
          control=m['public_controls']['weapon_set']
          assert control['creator_exposed'] is True
          assert control['selection_atomic'] is True
          assert control['atomic_slots']==['weapon_main','weapon_offhand']
          assert control['direct_slot_controls'] is False
          assert control['weapon_back_control'] is False
          assert control['combat_loadout_mutation'] is False
          assert control['default_id']=='weapon_none'
          assert list(m['weapon_sets'])==['weapon_none','weapon_01_lian_serene_katana']
          assert all(v['runtime_ready'] is True and v['production_ready'] is True and v['creator_ready'] is True for v in m['weapon_sets'].values())
          assert m['weapon_sets']['weapon_01_lian_serene_katana']['weapon_main']=='katana_lian_wu'
          assert m['weapon_sets']['weapon_01_lian_serene_katana']['weapon_offhand'] is None
          assert m['weapon_sets']['weapon_01_lian_serene_katana']['combat_reference']=='serene_katana'
          assert m['modules']['katana_lian_wu']['creator_ready'] is True

          assert c['stage']=='BASE-05.4' and c['status'] in ('validation_pending','production_approved')
          assert c['control']['name']=='WeaponSetOption'
          assert c['control']['selection_unit']=='weapon_set'
          assert c['control']['atomic_slots']==['weapon_main','weapon_offhand']
          assert c['control']['direct_slot_controls'] is False
          assert c['control']['weapon_back_creator_control'] is False
          assert c['control']['combat_loadout_mutation'] is False
          assert c['control']['production_options']==['weapon_none','weapon_01_lian_serene_katana']
          assert c['battle_contract']['combat_weapon_id']=='serene_katana'
          assert c['battle_contract']['neutral_weapon_main_visible'] is False
          assert c['battle_contract']['attack_light_weapon_main_visible'] is True
          assert r['status']=='production_approved_state_aware_runtime'
          assert r['promotion']['creator_exposure'] is False
          assert r['promotion']['runtime_validation']=='pass'

          assert 'WeaponSetOption' in source
          assert 'func set_weapon_set' in source
          assert 'weapon_set_combat_loadout_mutation' in source
          assert 'WeaponMainOption' not in source
          assert 'WeaponOffhandOption' not in source
          assert 'WeaponBackOption' not in source
          assert not Path('.github/workflows/base05-4-disposable-creator-patcher.yml').exists()
          assert not Path('.github/workflows/base05-4-disposable-runtime-fixer.yml').exists()
          print('BASE05_4_STATIC=PASS options=2 unit=weapon_set atomic=true direct_slots=false')
          print('BASE05_4_OWNERSHIP=PASS weapon_back_internal=true combat_mutation=false combat_owner=WeaponKitCatalog')
          print('BASE05_4_DISPOSABLE_WRITERS=ABSENT patcher=true fixer=true')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3 and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project fail closed
        run: |
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee base05-4-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|ERR_FILE_CORRUPT' base05-4-import.log; then exit 1; fi

      - name: Preserve BASE-05.3 state-aware weapon runtime
        run: |
          ./godot --headless --path . --script res://scripts/ci/base05_3_weapon_main_runtime_smoke.gd 2>&1 | tee base05-4-base05-3.log
          grep -q 'BASE05_3_WEAPON_MAIN_RUNTIME=PASS module=katana_lian_wu initial_visible=false toggle=true combat_reference=serene_katana' base05-4-base05-3.log
          grep -q 'BASE05_3_LAYER_CHAIN=PASS weapon_back=3 back_accessory=4 hair_back=5 weapon_main=80' base05-4-base05-3.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|BASE05_3_RUNTIME=BLOCKED' base05-4-base05-3.log; then exit 1; fi

      - name: Validate BASE-05.4 Creator, preset, battle and layout end to end
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://scripts/ci/base05_4_weapon_set_creator_control_smoke.gd 2>&1 | tee base05-4-runtime.log
          grep -q 'BASE05_4_WEAPON_SET_CONTROL=PASS options=2 unit=weapon_set atomic=weapon_main+weapon_offhand' base05-4-runtime.log
          grep -q 'BASE05_4_DIRECT_SLOT_CONTROLS=ABSENT weapon_main=true weapon_offhand=true weapon_back=true' base05-4-runtime.log
          grep -q 'BASE05_4_LIVE_PREVIEW=PASS weapon_main=80 weapon_back=3 back=4 hair=5 prior_packs=true' base05-4-runtime.log
          grep -q 'BASE05_4_NONE_TRANSACTION=PASS main_cleared=true offhand_cleared=true weapon_back_preserved=true combat_preserved=true' base05-4-runtime.log
          grep -q 'BASE05_4_PRESET_ROUNDTRIP=PASS schema=v2 weapon_set=weapon_01_lian_serene_katana combat_loadout_preserved=true' base05-4-runtime.log
          grep -q 'BASE05_4_BATTLE_HANDOFF=PASS weapon_main=katana_lian_wu combat=serene_katana neutral=false attack=true' base05-4-runtime.log
          grep -q 'BASE05_4_LAYOUT=PASS controls=5 overlap=false identity_overlap=false viewport=1280x720' base05-4-runtime.log
          grep -q 'BASE05_4_WEAPON_SET_CREATOR_CONTROL=PASS' base05-4-runtime.log
          test -s artifacts/base05_4/BASE05_4_WEAPON_SET_CREATOR_CONTROL.review-1280x720.png
          if grep -Eq 'SCRIPT ERROR|Parse Error|BASE05_4_CREATOR=BLOCKED' base05-4-runtime.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BASE05-4-WEAPON-SET-CREATOR-CONTROL
          path: |
            base05-4-import.log
            base05-4-base05-3.log
            base05-4-runtime.log
            artifacts/base05_4/BASE05_4_WEAPON_SET_CREATOR_CONTROL.review-1280x720.png
            assets/modular_fighters/base_05/manifest.json
            assets/modular_fighters/base_05/production/BASE05_WEAPON_SET_CREATOR_CONTROL.json
            assets/modular_fighters/base_05/production/BASE05_KATANA_LIAN_WU_PACK_01_RUNTIME.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'BASE-05.4 atomic Weapon Set Creator Control validation — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
