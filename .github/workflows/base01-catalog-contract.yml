name: BASE-01 Catalog Contract

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_01/catalog.json'
      - 'assets/modular_fighters/base_01/palettes/**'
      - 'scripts/ci/validate_base01_catalog.py'
      - '.github/workflows/base01-catalog-contract.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate BASE-01 catalog and palettes
        run: python scripts/ci/validate_base01_catalog.py
