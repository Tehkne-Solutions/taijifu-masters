name: Observability Contract

on:
  pull_request:
    paths:
      - 'scripts/observability/**'
      - 'scripts/telemetry/**'
      - 'tests/test_observability_contract.py'
      - 'docs/REMOTE-FIRST-OBSERVABILITY.md'
      - '.github/workflows/observability-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run observability contract
        run: python -m pytest -q tests/test_observability_contract.py
