name: TGAP Legacy Usage Audit

on:
  pull_request:
    paths:
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "tests/tgap/test_legacy_usage_audit.py"
      - "scripts/tgap_audit_legacy_usage.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/tgap/test_legacy_usage_audit.py
      - run: python scripts/tgap_audit_legacy_usage.py
      - uses: actions/upload-artifact@v4
        with:
          name: tgap-legacy-usage-report
          path: artifacts/tgap/legacy-usage-report.json
