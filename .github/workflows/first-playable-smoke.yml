name: First Playable Smoke

on:
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/vertical_slice/**"
      - "scenes/fighter/**"
      - "scripts/vertical_slice/**"
      - "scripts/fighter/**"
      - "scripts/telemetry/**"
      - "scripts/create-first-playable-build-manifest.py"
      - "scripts/arena/triple_path_arena.gd"
      - "scripts/runtime/tactical_bot_runtime.gd"
      - "scripts/ai/bot_behavior_catalog.gd"
      - "scripts/core/**"
      - "scripts/combat/**"
      - "scripts/visual/character_visual_catalog.gd"
      - "tools/playtest/**"
      - "playtest/pilots/**"
      - "docs/FIRST-PLAYABLE-PILOT-09.md"
      - ".github/ISSUE_TEMPLATE/first-playable-playtest.yml"
      - "tests/first_playable*.gd"
      - "tests/test_first_playable_report_aggregator.py"
      - "tests/test_first_playable_playtest_kit.py"
      - "tests/test_first_playable_pilot*.py"
      - ".github/workflows/first-playable-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run First Playable report aggregator tests
        run: python3 -m unittest discover -s tests -p 'test_first_playable_report_aggregator.py' -v

      - name: Run external playtest kit tests
        run: python3 -m unittest discover -s tests -p 'test_first_playable_playtest_kit.py' -v

      - name: Run controlled pilot operations and fixture tests
        run: python3 -m unittest discover -s tests -p 'test_first_playable_pilot*.py' -v

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project completely
        run: |
          set -euo pipefail
          ./godot --headless --path . --import 2>&1 | tee first-playable-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' first-playable-import.log; then
            echo 'FIRST_PLAYABLE_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run First Playable character contract
        run: ./godot --headless --path . --script tests/first_playable_character_contract_test.gd

      - name: Run First Playable combo combat contract
        run: ./godot --headless --path . --script tests/first_playable_combo_combat_contract.gd

      - name: Run First Playable adaptive master contract
        run: ./godot --headless --path . --script tests/first_playable_adaptive_master_contract.gd

      - name: Run First Playable scene smoke
        run: ./godot --headless --path . --script tests/first_playable_scene_smoke.gd

      - name: Run First Playable menu and UI flow
        run: ./godot --headless --path . --script tests/first_playable_flow_test.gd

      - name: Run First Playable AI behavior
        run: ./godot --headless --path . --script tests/first_playable_ai_behavior_test.gd

      - name: Run First Playable match cycle
        run: ./godot --headless --path . --script tests/first_playable_match_cycle_test.gd

      - name: Run First Playable ten-match QA matrix
        run: ./godot --headless --path . --script tests/first_playable_qa_matrix_test.gd

      - name: Run First Playable playtest telemetry contract
        run: ./godot --headless --path . --script tests/first_playable_playtest_telemetry_test.gd
