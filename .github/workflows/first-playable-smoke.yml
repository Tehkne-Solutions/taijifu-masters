name: First Playable Smoke

on:
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/vertical_slice/**"
      - "scenes/fighter/**"
      - "scripts/vertical_slice/**"
      - "scripts/fighter/**"
      - "scripts/telemetry/**"
      - "scripts/create-first-playable-build-manifest.py"
      - "scripts/arena/triple_path_arena.gd"
      - "scripts/runtime/tactical_bot_runtime.gd"
      - "scripts/runtime/procedural_arena_pickup_runtime.gd"
      - "scripts/runtime/pilot_feedback_guard_runtime.gd"
      - "scripts/ci/procedural_arena_pickups_smoke_test.gd"
      - "scripts/ai/bot_behavior_catalog.gd"
      - "scripts/core/**"
      - "scripts/combat/**"
      - "scripts/visual/character_visual_catalog.gd"
      - "config/v2-arena-intake-contract.json"
      - "tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1"
      - "tools/playtest/**"
      - "playtest/pilots/**"
      - "docs/FIRST-PLAYABLE-PILOT-09.md"
      - ".github/ISSUE_TEMPLATE/first-playable-playtest.yml"
      - "tests/first_playable*.gd"
      - "tests/test_first_playable_report_aggregator.py"
      - "tests/test_first_playable_playtest_kit.py"
      - "tests/test_first_playable_pilot*.py"
      - ".github/workflows/first-playable-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Materialize composed First Playable snapshot through C30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-first-playable'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath first-playable-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require immutable 89-frame snapshot before gameplay smoke
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VM02_C30_SOURCE_PIN=PASS' first-playable-c30.log
          grep -q 'VM02_C30_SNAPSHOT_FREEZE=PASS' first-playable-c30.log
          grep -q 'VM02_C30_SNAPSHOT_LIAN=PASS frames=45 animations=10' first-playable-c30.log
          grep -q 'VM02_C30_SNAPSHOT_RIVAL=PASS frames=44 animations=10' first-playable-c30.log
          grep -q 'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89' first-playable-c30.log
          grep -q 'VM02_C30_ARENA_FILE_COUNT=6/6' first-playable-c30.log
          grep -q 'VM02_C30_SOURCE_MANIFEST_SCHEMA=PASS' first-playable-c30.log
          grep -q 'VM02_C30_SNAPSHOT_STAGE=PASS layers=3' first-playable-c30.log
          grep -q 'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS' first-playable-c30.log
          grep -q 'VM02_C30_ARENA_CANONICAL_READY=PASS' first-playable-c30.log
          echo 'FIRST_PLAYABLE_CANONICAL_SNAPSHOT=PASS ref=assets-first-playable-v1.0.0 fighters=89 stage_layers=3'

      - name: Run First Playable report aggregator tests
        run: python3 -m unittest discover -s tests -p 'test_first_playable_report_aggregator.py' -v

      - name: Run external playtest kit tests
        run: python3 -m unittest discover -s tests -p 'test_first_playable_playtest_kit.py' -v

      - name: Run controlled pilot operations and fixture tests
        run: python3 -m unittest discover -s tests -p 'test_first_playable_pilot*.py' -v

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project completely
        run: |
          set -euo pipefail
          ./godot --headless --path . --import 2>&1 | tee first-playable-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' first-playable-import.log; then
            echo 'FIRST_PLAYABLE_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Run First Playable character contract
        run: ./godot --headless --path . --script tests/first_playable_character_contract_test.gd

      - name: Run First Playable combo combat contract
        run: |
          set -o pipefail
          timeout 30s ./godot --headless --path . --script tests/first_playable_combo_combat_contract.gd 2>&1 | tee first-playable-combo-contract.log

      - name: Run First Playable adaptive master contract
        run: ./godot --headless --path . --script tests/first_playable_adaptive_master_contract.gd

      - name: Run First Playable scene smoke
        run: ./godot --headless --path . --script tests/first_playable_scene_smoke.gd

      - name: Run First Playable menu and UI flow
        run: ./godot --headless --path . --script tests/first_playable_flow_test.gd

      - name: Run Pilot 09 feedback navigation guard
        run: ./godot --headless --path . --script tests/first_playable_pilot_feedback_guard_test.gd

      - name: Run First Playable AI behavior
        run: ./godot --headless --path . --script tests/first_playable_ai_behavior_test.gd

      - name: Run First Playable match cycle
        run: ./godot --headless --path . --script tests/first_playable_match_cycle_test.gd

      - name: Run First Playable ten-match QA matrix
        run: ./godot --headless --path . --script tests/first_playable_qa_matrix_test.gd

      - name: Run First Playable playtest telemetry contract
        run: ./godot --headless --path . --script tests/first_playable_playtest_telemetry_test.gd

      - name: Run pickup autoload scene isolation contract
        run: ./godot --headless --path . --script scripts/ci/procedural_arena_pickups_smoke_test.gd

      - name: Upload First Playable diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: first-playable-smoke-diagnostics
          path: |
            first-playable-c30.log
            first-playable-import.log
            first-playable-combo-contract.log
          if-no-files-found: ignore

# Tehkné Solutions
