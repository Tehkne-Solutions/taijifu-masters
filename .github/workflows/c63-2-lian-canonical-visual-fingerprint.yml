name: C63.4 Lian Canonical Visual Fingerprint

on:
  pull_request:
    paths:
      - 'assets/characters/lian_wu/character_lock/lian_wu_neutral.png'
      - 'tools/lian_wu_canonical_identity.py'
      - 'config/character_identity/lian_wu_canonical_visual_identity.json'
      - '.github/workflows/c63-2-lian-canonical-visual-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-visual-fingerprint:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic image dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow==12.3.0

      - name: Validate recovered historical neutral as canonical identity
        run: |
          set -euo pipefail
          test -f assets/characters/lian_wu/character_lock/lian_wu_neutral.png
          echo '0e435757b5c8a114f3ba91653f79bc86db51ee9cf3bfb74c529efed5d4ff7ab5  assets/characters/lian_wu/character_lock/lian_wu_neutral.png' | sha256sum -c -
          python3 tools/lian_wu_canonical_identity.py \
            assets/characters/lian_wu/character_lock/lian_wu_neutral.png \
            --json c63-4-canonical-visual-identity.json

      - name: Prove deterministic release reconstruction is noncanonical
        run: |
          set -euo pipefail
          URL='https://github.com/Tehkne-Solutions/taijifu-masters-assets/releases/download/assets-pack-01-v1.0.0/PACK_01_LIAN_WU_BASE_FINAL_v1.0.0.zip'
          curl --fail --location --retry 3 --output /tmp/pack01.zip "$URL"
          echo '0aea374365b8736ae2134312e94d8128260a9c7650cc840aa2e588a4ab70872a  /tmp/pack01.zip' | sha256sum -c -
          rm -rf /tmp/c63-4-pack /tmp/c63-4-clean
          mkdir -p /tmp/c63-4-pack /tmp/c63-4-clean
          unzip -q /tmp/pack01.zip -d /tmp/c63-4-pack
          echo '047de240f47d6b8ba1e0605dd3353dc3bd6921ae7589163b74c1855d1b5cf1ec  /tmp/c63-4-pack/turnaround/char_lian_wu__front_raw.png' | sha256sum -c -
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Tehkne-Solutions/taijifu-masters-assets/f2f64600ce93396887e88d7b781553da54572da5/tools/build_lian_wu_canonical_clean_v101.py' \
            --output /tmp/build_lian_wu_canonical_clean_v101.py
          python3 /tmp/build_lian_wu_canonical_clean_v101.py /tmp/c63-4-pack /tmp/c63-4-clean
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image
          path=Path('/tmp/c63-4-clean/char_lian_wu__front_clean.png')
          with Image.open(path) as opened:
              rgba=opened.convert('RGBA')
              digest=hashlib.sha256(rgba.tobytes()).hexdigest()
              alpha=rgba.getchannel('A').point(lambda value:255 if value>=3 else 0)
              bounds=alpha.getbbox() or (0,0,0,0)
          expected_digest='c2cf8ea213692090832b7859119e98ddf2c862b23f9a3f94200e5d15280b78e2'
          expected_bounds=(303,70,720,970)
          if digest != expected_digest or bounds != expected_bounds:
              raise SystemExit(f'C63_4_RECONSTRUCTION_PROBE=BLOCKED digest={digest} bounds={bounds}')
          print(f'C63_4_RECONSTRUCTION_CANDIDATE=PASS digest={digest} bounds={bounds}')
          print('C63_4_RECONSTRUCTION_CLASSIFICATION=NONCANONICAL')
          print('SIGNATURE=Tehkné Solutions')
          PY
          set +e
          python3 tools/lian_wu_canonical_identity.py /tmp/c63-4-clean/char_lian_wu__front_clean.png > /tmp/c63-4-reconstruction-validator.log 2>&1
          rc=$?
          set -e
          cat /tmp/c63-4-reconstruction-validator.log
          if [ "$rc" -ne 2 ]; then
            echo "C63_4_RECONSTRUCTION_REJECTION=BLOCKED rc=$rc"
            exit 1
          fi
          grep -q 'rgba_identity_mismatch=' /tmp/c63-4-reconstruction-validator.log
          echo 'C63_4_RECONSTRUCTION_REJECTION=PASS'

      - name: Enforce zero legacy binary-hash generator locks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          old='0e435757b5c8a114f3ba91653f79bc86db51ee9cf3bfb74c529efed5d4ff7ab5'
          files=[]
          for path in sorted(Path('tools').glob('generate_lian_wu_*.py')):
              if old in path.read_text(encoding='utf-8'):
                  files.append(path.as_posix())
          report={
              'schema':'tehkne/c63-4-generator-binary-lock-inventory/v1',
              'signature':'Tehkné Solutions',
              'legacy_binary_sha256':old,
              'locked_generator_count':len(files),
              'locked_generators':files,
          }
          Path('c63-4-generator-binary-lock-inventory.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          if files:
              raise SystemExit('C63_4_LEGACY_BINARY_LOCKS=BLOCKED '+','.join(files))
          print('C63_4_LEGACY_BINARY_LOCKS=PASS count=0')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C63-4-LIAN-CANONICAL-VISUAL-FINGERPRINT
          path: |
            c63-4-canonical-visual-identity.json
            c63-4-generator-binary-lock-inventory.json
            /tmp/c63-4-reconstruction-validator.log
          if-no-files-found: error

      - name: Summary
        run: |
          echo 'C63.4 exact historical canonical visual fingerprint — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
