name: AUDIO-04 Runtime Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/audio04-mastering-accessibility'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch mastering and pause accessibility controls
        run: |
          python3 tools/audio04_patch_runtime.py
          grep -q '"stage": "AUDIO-04"' scripts/vertical_slice/first_playable_audio_director.gd
          grep -q 'func audio_mix_snapshot' scripts/vertical_slice/first_playable_audio_director.gd
          grep -q 'AudioProfileButton' scripts/vertical_slice/first_playable_hud_controller.gd
          grep -q 'audio_accessibility_controls' scripts/vertical_slice/first_playable_hud_controller.gd
      - name: Remove disposable writer
        run: |
          rm tools/audio04_patch_runtime.py
          rm .github/workflows/audio04-runtime-materializer.yml
      - name: Commit materialized product
        run: |
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add scripts/vertical_slice/first_playable_audio_director.gd scripts/vertical_slice/first_playable_hud_controller.gd tools/audio04_patch_runtime.py .github/workflows/audio04-runtime-materializer.yml
          git diff --cached --check
          git commit -m 'AUDIO-04: materialize mastering and accessibility controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
