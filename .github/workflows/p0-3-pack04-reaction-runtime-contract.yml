name: P0.3 PACK 04 Reaction Runtime Contract

on:
  pull_request:
    paths:
      - 'scripts/fighter/first_playable_combat_fighter_controller.gd'
      - 'scripts/runtime/tgap_asset_loader.gd'
      - 'scripts/vertical_slice/first_playable_pack04_tgap_materialization.gd'
      - 'scripts/vertical_slice/first_playable_pack04_reaction_runtime.gd'
      - 'scripts/vertical_slice/first_playable_skeletal_modular_fighter_presenter.gd'
      - 'scripts/vertical_slice/training_rival_lot01_presenter.gd'
      - 'tests/p0_3_pack04_tgap_materialization_contract_test.gd'
      - 'tests/p0_3_pack04_reaction_runtime_contract_test.gd'
      - 'tests/p0_3_pack04_presenter_handoff_test.gd'
      - '.github/workflows/p0-3-pack04-reaction-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaction-runtime-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Materialize canonical First Playable snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'taijifu-masters-assets-pack04-runtime'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          & ./tools/RUN-VM02-C30-V2-ARENA-INTAKE-GATE.ps1 -RepoRoot $PWD -AssetsRepoRoot $assets *>&1 | Tee-Object -FilePath pack04-runtime-c30.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require canonical snapshot authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VM02_C30_SOURCE_PIN=PASS' pack04-runtime-c30.log
          grep -q 'VM02_C30_SNAPSHOT_FIGHTER_FRAME_COUNT=89/89' pack04-runtime-c30.log
          grep -q 'VM02_C30_FIRST_PLAYABLE_SNAPSHOT=PASS' pack04-runtime-c30.log
          echo 'PACK04_RUNTIME_CANONICAL_SNAPSHOT=PASS'

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --retry-all-errors \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee pack04-runtime-import.log
          if grep -Eq 'SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error' pack04-runtime-import.log; then
            echo 'PACK04_RUNTIME_IMPORT=BLOCKED'
            exit 1
          fi
          echo 'PACK04_RUNTIME_IMPORT=PASS'

      - name: Run TGAP materialization contract gate
        run: |
          set -o pipefail
          timeout 90s ./godot --headless --audio-driver Dummy --path . \
            --script res://tests/p0_3_pack04_tgap_materialization_contract_test.gd \
            2>&1 | tee pack04-materialization.log
          grep -q 'PACK04_MATERIALIZATION_DEFAULT=PASS available=false' pack04-materialization.log
          grep -q 'PACK04_MATERIALIZATION_COMPLETE_FIXTURE=PASS assets=34 synthetic=true runtime_active=false' pack04-materialization.log
          grep -q 'PACK04_MATERIALIZATION_CHECKSUM_FORMAT=PASS file=checksums.sha256 format=sha256sum entries=37' pack04-materialization.log
          grep -q 'PACK04_MATERIALIZATION_APPROVAL_GATE=PASS rejected=PENDING' pack04-materialization.log
          grep -q 'PACK04_MATERIALIZATION_CHECKSUM_GATE=PASS tamper=rejected' pack04-materialization.log
          grep -q 'PACK04_MATERIALIZATION_TGAP_AUTHORITY=PASS install=false staging=false promotion=false catalog_write=false' pack04-materialization.log
          grep -q 'PACK04_TGAP_MATERIALIZATION_CONTRACT=PASS production_art_status=BLOCKED playtest_02=BLOCKED' pack04-materialization.log
          grep -q 'SIGNATURE=Tehkné Solutions' pack04-materialization.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|PACK04_MATERIALIZATION_GATE=BLOCKED|production_art_status=PASS' pack04-materialization.log; then
            echo 'PACK04_TGAP_MATERIALIZATION_CI=BLOCKED'
            exit 1
          fi
          echo 'PACK04_TGAP_MATERIALIZATION_CI=PASS production_art_status=blocked checksum=checksums.sha256'

      - name: Run semantic reaction runtime product gate
        run: |
          set -o pipefail
          timeout 90s ./godot --headless --audio-driver Dummy --path . \
            --script res://tests/p0_3_pack04_reaction_runtime_contract_test.gd \
            2>&1 | tee pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_DUAL_FIGHTER=PASS p1=true p2=true' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_STATES=PASS states=block_recoil,parry,posture_break,knockback,neutral_recovery' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_SIGNAL_OBSERVER=PASS result=blocked semantic=block_recoil' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_SEQUENCE=PASS hit=existing_hit>knockback>neutral_recovery' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_FALLBACKS=PASS block_recoil=guard parry=guard posture_break=hit knockback=hit neutral_recovery=idle' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_ART_STATUS=BLOCKED release=assets-pack-04-v1.0.0' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_PHYSICS_AUTHORITY=PASS owner=fighter_physics changes=false' pack04-runtime-product.log
          grep -q 'PACK04_RUNTIME_CONTRACT_GATE=PASS' pack04-runtime-product.log
          grep -q 'SIGNATURE=Tehkné Solutions' pack04-runtime-product.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|PACK04_RUNTIME_GATE=BLOCKED|PACK04_RUNTIME_ART_STATUS=PASS' pack04-runtime-product.log; then
            echo 'PACK04_RUNTIME_CONTRACT_CI=BLOCKED'
            exit 1
          fi
          echo 'PACK04_RUNTIME_CONTRACT_CI=PASS art_status=blocked'

      - name: Run presenter handoff product gate
        run: |
          set -o pipefail
          timeout 90s ./godot --headless --audio-driver Dummy --path . \
            --script res://tests/p0_3_pack04_presenter_handoff_test.gd \
            2>&1 | tee pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_HANDOFF=PASS p1=skeletal_modular p2=training_rival' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_BLOCK=PASS p1=guard p2=guard' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_PARRY=PASS p1=guard p2=guard' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_POSTURE=PASS p1=hit p2=hit' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_KNOCKBACK=PASS p1=hit p2=hit' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_NEUTRAL=PASS p1=idle p2=idle' pack04-presenter-handoff.log
          grep -q 'PACK04_SKELETON_HANDOFF=PASS states=guard,hit,idle authored_library_preserved=true' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_ART_STATUS=BLOCKED release=assets-pack-04-v1.0.0' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_GAMEPLAY_AUTHORITY=PASS owner=fighter_physics changes=false' pack04-presenter-handoff.log
          grep -q 'PACK04_PRESENTER_HANDOFF_GATE=PASS' pack04-presenter-handoff.log
          grep -q 'SIGNATURE=Tehkné Solutions' pack04-presenter-handoff.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|PACK04_PRESENTER_GATE=BLOCKED|PACK04_PRESENTER_ART_STATUS=PASS' pack04-presenter-handoff.log; then
            echo 'PACK04_PRESENTER_HANDOFF_CI=BLOCKED'
            exit 1
          fi
          echo 'PACK04_PRESENTER_HANDOFF_CI=PASS art_status=blocked'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0-3-PACK04-REACTION-RUNTIME-CONTRACT-EVIDENCE
          path: |
            pack04-runtime-c30.log
            pack04-runtime-import.log
            pack04-materialization.log
            pack04-runtime-product.log
            pack04-presenter-handoff.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'P0.3 PACK 04 TGAP materialization + semantic runtime + presenter fallback ready; checksum authority aligned to assets release; production reaction art remains blocked — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"

# Tehkné Solutions
