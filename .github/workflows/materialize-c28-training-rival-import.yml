name: C28 Training Rival Remote Materializer

on:
  push:
    branches:
      - agent/c28-training-rival-44-import
    paths:
      - 'config/v2-rival-intake-contract.json'
      - 'tools/import_training_rival_c28_from_assets.py'
      - '.github/workflows/materialize-c28-training-rival-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned assets repository
        uses: actions/checkout@v4
        with:
          repository: Tehkne-Solutions/taijifu-masters-assets
          ref: cf160e3472f0ff180cbad52b5ff82c86d3920033
          path: _assets_repo
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize LFS objects from assets snapshot
        working-directory: _assets_repo
        run: git lfs pull
      - name: Import canonical Training Rival 44/44
        shell: bash
        run: |
          set -o pipefail
          python tools/import_training_rival_c28_from_assets.py --assets-root _assets_repo --game-root . 2>&1 | tee c28-materialize.log
          grep -q 'VM02_C28_ASSETS_REVISION=PASS sha=cf160e3472f0ff180cbad52b5ff82c86d3920033' c28-materialize.log
          grep -q 'VM02_C28_CANONICAL_CONTRACT=PASS frames=44/44 runtime_pending=true' c28-materialize.log
          grep -q 'VM02_C28_RIVAL_FRAME_CONTRACT=PASS frames=44/44 hashes=true' c28-materialize.log
          grep -q 'VM02_C28_RIVAL_IMPORT=PASS' c28-materialize.log
          grep -q 'VM02_C28_SPRITEFRAMES_GENERATED=PASS animations=10 frames=44' c28-materialize.log
          grep -q 'VM02_C28_IMPORT=PASS' c28-materialize.log
      - name: Remove writer and validate staged product read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _assets_repo
          git rm -- .github/workflows/materialize-c28-training-rival-import.yml
          python tools/validate_training_rival_c28_import.py 2>&1 | tee c28-static-validation.log
          grep -q 'VM02_C28_IMPORTED_PACK=PASS frames=44/44' c28-static-validation.log
          grep -q 'VM02_C28_DISPOSABLE_WRITER=ABSENT' c28-static-validation.log
      - name: Commit exact imported product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@tehkne.solutions'
          git add -- assets/tgap/training_rival/first_playable_lot_01
          mapfile -t STAGED < <(git diff --cached --name-only)
          printf 'VM02_C28_STAGED=%s\n' "${STAGED[@]}"
          test "${#STAGED[@]}" -eq 49
          git commit -m 'C28: import canonical Training Rival 44/44 and remove writer'
          git push origin HEAD:agent/c28-training-rival-44-import
          echo 'VM02_C28_REMOTE_MATERIALIZATION=PASS product_files=48 writer_removed=true'
          echo 'VM02_C28_PROXY_RETIREMENT=BLOCKED godot_runtime_bench_required=true'
          echo 'SIGNATURE=Tehkné Solutions'
