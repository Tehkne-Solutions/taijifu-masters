name: Taijifu Asset Forge Review

on:
  pull_request:
    paths:
      - 'tools/asset_forge/review_page.py'
      - 'asset-forge/review/**'
      - 'tests/asset_forge/test_review_page.py'
      - '.github/workflows/taijifu-asset-forge-review.yml'
  workflow_dispatch:

jobs:
  review-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar testes
        run: python -m pip install -r requirements-tgap-test.txt
      - name: Testar gerador
        run: python -m pytest -q tests/asset_forge/test_review_page.py
      - name: Gerar revisão diagnóstica do Pack 01
        run: python tools/asset_forge/review_page.py asset-forge/review/pack_01_lian_wu_base.json
      - name: Publicar página de revisão
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-pack01-visual-review
          path: artifacts/asset-forge/review/pack_01_lian_wu_base/site
          retention-days: 30
