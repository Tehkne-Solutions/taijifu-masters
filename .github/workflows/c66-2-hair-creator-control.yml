name: C66.2 Hair Creator Control

on:
  pull_request:
    paths:
      - 'assets/modular_fighters/base_02/manifest.json'
      - 'assets/modular_fighters/base_02/production/BASE02_HAIR_CREATOR_CONTROL.json'
      - 'scripts/characters/modular_fighter_hair_runtime.gd'
      - 'scripts/characters/modular_fighter_creator_scene.gd'
      - 'scripts/ci/base02_hair_creator_control_smoke.gd'
      - 'scripts/ci/base02_hair_creator_visual_review.gd'
      - '.github/workflows/c66-2-hair-creator-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hair-creator-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved C66.2 control contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('assets/modular_fighters/base_02/manifest.json').read_text())
          contract = json.loads(Path('assets/modular_fighters/base_02/production/BASE02_HAIR_CREATOR_CONTROL.json').read_text())
          assert manifest['version'] == '1.1.0'
          assert manifest['status'] == 'production_approved_creator_control'
          promotion = manifest['promotion']
          assert promotion['creator_exposure'] is True
          assert promotion['creator_control_validation'] == 'pass'
          assert promotion['creator_evidence']['workflow_run'] == 31331687918
          assert promotion['creator_evidence']['artifact_id'] == 9043113353
          assert contract['component_id'] == 'BASE02_HAIR_CREATOR_CONTROL'
          assert contract['stage'] == 'C66.2'
          assert contract['status'] == 'production_approved'
          control = contract['control_contract']
          assert control['public_control'] == 'hair_style'
          assert control['internal_slots'] == ['hair_back', 'hair_front']
          assert control['direct_internal_slot_controls'] is False
          assert control['production_ready_styles_only'] is True
          assert control['initial_options'] == ['hair_none', 'hair_01_lian_topknot']
          preset = contract['preset_contract']
          assert preset['schema'] == 'tehkne/taijifu-modular-fighter-preset/v2'
          assert preset['legacy_schema_change'] is False
          assert preset['cross_style_mixing_allowed'] is False
          validation = contract['validation']
          assert validation['creator_smoke'] == 'pass'
          assert validation['preset_roundtrip'] == 'pass'
          assert validation['battle_handoff'] == 'pass'
          assert validation['graphical_creator_review'] == 'pass'
          print('C66_2_STATIC_CONTRACT=PASS status=production_approved control=hair_style slots_internal=true')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - name: Install Godot 4.3 and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project fail closed
        run: |
          set -euo pipefail
          rm -rf .godot
          ./godot --headless --path . --import 2>&1 | tee c66-2-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed' c66-2-import.log; then
            echo 'C66_2_IMPORT=BLOCKED'
            exit 1
          fi

      - name: Preserve C66.1 Hair pack runtime
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base02_hair_pack_01_runtime_smoke.gd 2>&1 | tee c66-2-pack-regression.log
          grep -q 'C66_1_HAIR_PACK_RUNTIME=PASS' c66-2-pack-regression.log
          grep -q 'C66_1_BATTLE_RUNTIME=PASS style=hair_01_lian_topknot build=lian_wu' c66-2-pack-regression.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C66_1_RUNTIME=BLOCKED' c66-2-pack-regression.log; then
            exit 1
          fi

      - name: Run Hair Creator save load and battle handoff smoke
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://scripts/ci/base02_hair_creator_control_smoke.gd 2>&1 | tee c66-2-creator.log
          grep -q 'C66_2_HAIR_CONTROL=PASS options=2 unit=hair_style' c66-2-creator.log
          grep -q 'C66_2_DIRECT_SLOT_CONTROLS=ABSENT' c66-2-creator.log
          grep -q 'C66_2_LIVE_PREVIEW=PASS back_z=5 front_z=50' c66-2-creator.log
          grep -q 'C66_2_PRESET_ROUNDTRIP=PASS schema=v2' c66-2-creator.log
          grep -q 'C66_2_BATTLE_HANDOFF=PASS style=hair_01_lian_topknot' c66-2-creator.log
          grep -q 'C66_2_HAIR_CREATOR_CONTROL=PASS' c66-2-creator.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|C66_2_CREATOR=BLOCKED' c66-2-creator.log; then
            exit 1
          fi

      - name: Capture graphical Creator regression
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/ci/base02_hair_creator_visual_review.gd \
            2>&1 | tee c66-2-visual.log
          grep -q 'C66_2_VISUAL_REVIEW=PASS style=hair_01_lian_topknot' c66-2-visual.log
          grep -q 'C66_2_VISUAL_CONTROL=PASS node=HairStyleOption location=creator_header' c66-2-visual.log
          grep -q 'C66_2_VISUAL_PREVIEW=PASS hair_back=true hair_front=true' c66-2-visual.log
          test -s artifacts/c66_2/C66_2_HAIR_CREATOR_CONTROL.review-1280x720.png
          if grep -Eq 'SCRIPT ERROR|Parse Error|C66_2_VISUAL=BLOCKED' c66-2-visual.log; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C66-2-HAIR-CREATOR-CONTROL-EVIDENCE
          path: |
            c66-2-import.log
            c66-2-pack-regression.log
            c66-2-creator.log
            c66-2-visual.log
            artifacts/c66_2/C66_2_HAIR_CREATOR_CONTROL.review-1280x720.png
            assets/modular_fighters/base_02/manifest.json
            assets/modular_fighters/base_02/production/BASE02_HAIR_CREATOR_CONTROL.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: echo 'C66.2 Hair Creator Control approved + graphical regression — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
