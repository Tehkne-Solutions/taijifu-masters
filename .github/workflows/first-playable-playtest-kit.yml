name: First Playable External Playtest Kit

on:
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/build-web.sh"
      - "scripts/build-windows.sh"
      - "scripts/create-first-playable-build-manifest.py"
      - "tools/playtest/**"
      - "playtest/pilots/**"
      - "tests/test_first_playable_report_aggregator.py"
      - "tests/test_first_playable_playtest_kit.py"
      - "tests/test_first_playable_pilot*.py"
      - "docs/FIRST-PLAYABLE-PLAYTEST*.md"
      - "docs/FIRST-PLAYABLE-PILOT-09.md"
      - ".github/workflows/first-playable-playtest-kit.yml"
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "web/**"
      - "web-tests/**"
      - "tools/playtest/**"
      - "playtest/pilots/**"
      - "docs/FIRST-PLAYABLE-PLAYTEST*.md"
      - "docs/FIRST-PLAYABLE-PILOT-09.md"
      - ".github/workflows/first-playable-playtest-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-playable-external-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-package:
    name: Construir e publicar kits externos
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot e templates
        uses: actions/cache@v4
        with:
          path: |
            .cache/godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-stable-export-templates-v1

      - name: Validar ferramentas de playtest
        run: |
          python3 -m unittest discover -s tests -p 'test_first_playable_report_aggregator.py' -v
          python3 -m unittest discover -s tests -p 'test_first_playable_playtest_kit.py' -v
          python3 -m unittest discover -s tests -p 'test_first_playable_pilot*.py' -v

      - name: Construir Windows x86_64
        env:
          GODOT_VERSION: "4.3"
          GODOT_CHANNEL: stable
        run: |
          set -o pipefail
          bash scripts/build-windows.sh 2>&1 | tee first-playable-kit-windows.log

      - name: Construir Web
        env:
          GODOT_VERSION: "4.3"
          GODOT_CHANNEL: stable
        run: |
          set -o pipefail
          bash scripts/build-web.sh 2>&1 | tee first-playable-kit-web.log

      - name: Instalar Chromium do Playwright
        working-directory: web-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Validar Web no Chromium
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web-build > first-playable-kit-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              cat first-playable-kit-web-server.log
              exit 1
            fi
            sleep 1
          done

          npm --prefix web-tests test -- \
            web-smoke.spec.cjs \
            controller-mastery-web.spec.cjs \
            gamepad-web.spec.cjs \
            --reporter=line 2>&1 | tee first-playable-kit-web-test.log

      - name: Montar kit externo do jogador
        run: |
          set -o pipefail
          python3 tools/playtest/create_first_playable_playtest_kit.py \
            --project-root . \
            --output-dir dist \
            --stage-dir playtest-kit-build \
            2>&1 | tee first-playable-kit-package.log

      - name: Validar kit externo do jogador
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          version = "0.2.2-playtest"
          zip_path = Path(f"dist/Taijifu-Masters-External-Playtest-Kit-{version}.zip")
          checksum_path = Path(str(zip_path) + ".sha256")
          manifest_path = Path("playtest-kit-build/manifests/kit-info.json")

          assert zip_path.is_file() and zip_path.stat().st_size > 0
          assert checksum_path.is_file()
          assert manifest_path.is_file()

          expected, referenced = checksum_path.read_text(encoding="utf-8").strip().split(maxsplit=1)
          assert referenced.lstrip("*") == zip_path.name
          assert "/" not in referenced and "\\" not in referenced
          actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert actual == expected

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schema"] == "tehkne/taijifu-first-playable-kit/v1"
          assert manifest["version"] == version
          assert manifest["signature"] == "Tehkné Solutions"
          assert manifest["telemetry_schema"] == "tehkne/taijifu-match-telemetry/v3"
          assert manifest["privacy"] == "local_only_no_automatic_upload"
          assert set(manifest["platforms"]) == {"windows-x86_64", "web"}

          required = {
              "README-PLAYTEST.txt",
              "builds/windows/Taijifu-Masters-First-Playable-Windows-x86_64.zip",
              "builds/windows/Taijifu-Masters-First-Playable-Windows-x86_64.zip.sha256",
              "builds/web/Taijifu-Masters-First-Playable-Web.zip",
              "builds/web/Taijifu-Masters-First-Playable-Web.zip.sha256",
              "docs/FIRST-PLAYABLE-PLAYTEST.md",
              "docs/FIRST-PLAYABLE-PLAYTEST-AGGREGATION.md",
              "tools/aggregate_first_playable_reports.py",
              "manifests/kit-info.json",
          }
          with zipfile.ZipFile(zip_path) as archive:
              names = set(archive.namelist())
          assert required.issubset(names), sorted(required - names)

          print(json.dumps({
              "kit": zip_path.name,
              "size_bytes": zip_path.stat().st_size,
              "sha256": actual,
              "files": manifest["totals"]["file_count"],
          }, indent=2))
          PY

      - name: Montar pacote privado do coordenador
        run: |
          set -o pipefail
          python3 tools/playtest/create_first_playable_pilot_coordinator_pack_r2.py \
            --project-root . \
            --pilot-id pilot-09-r2 \
            --external-kit dist/Taijifu-Masters-External-Playtest-Kit-0.2.2-playtest.zip \
            --external-kit-checksum dist/Taijifu-Masters-External-Playtest-Kit-0.2.2-playtest.zip.sha256 \
            --output-dir dist \
            --stage-dir pilot-coordinator-build \
            2>&1 | tee first-playable-pilot-coordinator-package.log

      - name: Validar pacote privado do coordenador
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          pilot_id = "pilot-09-r2"
          version = "0.2.2-playtest"
          name = f"Taijifu-Masters-Pilot-Coordinator-{pilot_id}-{version}.zip"
          zip_path = Path("dist") / name
          checksum_path = Path(str(zip_path) + ".sha256")
          manifest_path = Path("pilot-coordinator-build/manifests/coordinator-pack-info.json")

          assert zip_path.is_file() and zip_path.stat().st_size > 0
          assert checksum_path.is_file()
          assert manifest_path.is_file()
          expected, referenced = checksum_path.read_text(encoding="utf-8").strip().split(maxsplit=1)
          assert referenced.lstrip("*") == zip_path.name
          assert "/" not in referenced and "\\" not in referenced
          actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert actual == expected

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schema"] == "tehkne/taijifu-first-playable-pilot-coordinator-pack/v1"
          assert manifest["pilot_id"] == pilot_id
          assert manifest["build_version"] == version
          assert manifest["signature"] == "Tehkné Solutions"
          assert manifest["privacy"] == "anonymous_templates_only_no_real_results"
          assert manifest["templates_empty"] is True
          assert manifest["participant_count"] == 9
          assert manifest["expected_total_matches"] == 54

          required = {
              "README-COORDENADOR.txt",
              f"game-kit/Taijifu-Masters-External-Playtest-Kit-{version}.zip",
              f"game-kit/Taijifu-Masters-External-Playtest-Kit-{version}.zip.sha256",
              "pilot/pilot-plan.json",
              "pilot/pilot-plan.md",
              "pilot/pilot-roster.csv",
              "pilot/pilot-observations.json",
              "pilot/pilot-decisions.json",
              "docs/FIRST-PLAYABLE-PILOT-09.md",
              "tools/run_first_playable_pilot.py",
              "tools/first_playable_pilot.py",
              "tools/aggregate_first_playable_reports.py",
              "manifests/coordinator-pack-info.json",
          }
          with zipfile.ZipFile(zip_path) as archive:
              names = set(archive.namelist())
              observations = json.loads(archive.read("pilot/pilot-observations.json"))
              decisions = json.loads(archive.read("pilot/pilot-decisions.json"))
              coordinator_readme = archive.read("README-COORDENADOR.txt").decode("utf-8")
          assert required.issubset(names), sorted(required - names)
          assert observations["observations"] == []
          assert decisions["decisions"] == []
          assert "Não renomeie arquivos corretamente prefixados" in coordinator_readme
          assert "pilot-09-r2" in coordinator_readme

          print(json.dumps({
              "coordinator_pack": zip_path.name,
              "size_bytes": zip_path.stat().st_size,
              "sha256": actual,
              "files": manifest["totals"]["file_count"],
              "templates_empty": True,
          }, indent=2))
          PY

      - name: Publicar kits de playtest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-external-playtest-kits-${{ github.sha }}
          path: |
            dist/Taijifu-Masters-External-Playtest-Kit-0.2.2-playtest.zip
            dist/Taijifu-Masters-External-Playtest-Kit-0.2.2-playtest.zip.sha256
            playtest-kit-build/manifests/kit-info.json
            dist/Taijifu-Masters-Pilot-Coordinator-pilot-09-r2-0.2.2-playtest.zip
            dist/Taijifu-Masters-Pilot-Coordinator-pilot-09-r2-0.2.2-playtest.zip.sha256
            pilot-coordinator-build/manifests/coordinator-pack-info.json
          if-no-files-found: error
          retention-days: 60

      - name: Publicar logs dos kits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-external-playtest-kit-logs-${{ github.sha }}
          path: |
            first-playable-kit-windows.log
            first-playable-kit-web.log
            first-playable-kit-web-server.log
            first-playable-kit-web-test.log
            first-playable-kit-package.log
            first-playable-pilot-coordinator-package.log
            web-tests/test-results/
          if-no-files-found: ignore
          retention-days: 14
