<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Taijifu Masters — Offline</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b14;color:#eef5ff;padding:24px}
    main{width:min(620px,100%);padding:40px;border:1px solid #8a7846;border-radius:24px;background:#101a2d;text-align:center}
    img{width:120px;height:120px}
    h1{margin:22px 0 10px;font-size:clamp(28px,5vw,44px);color:#f4d477}
    p{margin:0 auto 24px;max-width:460px;line-height:1.65;color:#c7d5e8}
    a{display:inline-block;border-radius:999px;padding:14px 24px;background:#f4d477;color:#07101d;font-weight:800;text-decoration:none}
    small{display:block;margin-top:28px;color:#71839b;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <img src="taijifu-web-icon.svg" alt="Taijifu Masters">
    <h1>O fluxo foi interrompido</h1>
    <p>Esta versão ainda não está disponível no cache deste dispositivo. Reconecte-se à internet e carregue o jogo uma vez para habilitar o modo offline.</p>
    <a href="./">Tentar novamente</a>
    <small>Tehkné Solutions</small>
  </main>
</body>
</html>
