services:
  - type: web
    name: taijifu-masters-web
    runtime: static
    buildCommand: bash scripts/build-web.sh
    staticPublishPath: ./web-build
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
